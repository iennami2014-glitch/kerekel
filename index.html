<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --danger: var(--tg-theme-destructive-text-color, #e53935);
      --ok: #2e9e4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; -webkit-tap-highlight-color: transparent;
    }
    #app { padding: 16px 16px 96px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 4px 0 4px; }
    .sub { color: var(--hint); font-size: 14px; margin: 0 0 16px; }
    .hint { color: var(--hint); font-size: 14px; }
    .back { margin: 0 0 8px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; }
    .tile {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; margin-bottom: 10px;
      background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 14px;
      font: inherit; text-align: left; cursor: pointer;
    }
    .tile:hover { border-color: var(--accent); }
    .tile:active { transform: scale(.985); }
    .icon { flex: 0 0 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--accent); color: var(--accent-text); }
    .t-main { flex: 1; min-width: 0; }
    .t-name { font-weight: 600; }
    .t-desc { color: var(--hint); font-size: 14px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-side { text-align: right; font-size: 14px; white-space: nowrap; }
    .arrow { color: var(--hint); font-size: 22px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid transparent;
      background: var(--card); color: var(--text); font: inherit; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
    .btn {
      padding: 12px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: var(--accent-text); white-space: nowrap;
    }
    .btn.wide { width: 100%; margin-top: 16px; }
    .btn.ghost { background: var(--card); color: var(--accent); }
    .btn.danger { background: none; color: var(--danger); }
    .empty { padding: 28px 16px; border-radius: 14px; background: var(--card); color: var(--hint); text-align: center; }
    .line { background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
    .line select { background: var(--bg); }
    .line-row { display: grid; grid-template-columns: 1fr 1fr auto 36px; gap: 6px; align-items: center; margin-top: 6px; }
    .line-row input { background: var(--bg); padding: 9px 10px; }
    .l-sum { font-size: 14px; text-align: right; min-width: 70px; }
    .icon-btn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--danger); font-size: 18px; cursor: pointer; }
    .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin: 14px 2px 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cnt-row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; padding: 10px; background: var(--card); border-radius: 12px; margin-bottom: 6px; }
    .cnt-row input { background: var(--bg); text-align: right; padding: 9px 10px; }
    .cnt-meta { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .plus { color: var(--ok); } .minus { color: var(--danger); }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 2px 8px; }
    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 8px 14px; border-radius: 20px;
      background: rgba(0,0,0,.75); color: #fff; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    .chk { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; margin: 12px 2px; }
    .chk input { width: 20px; height: 20px; margin: 0; }
    .rep-row { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--card); border-radius: 10px; margin-bottom: 4px; }
    .rep-row .t-main div:first-child { overflow-wrap: anywhere; }
    .cat-head { display: flex; justify-content: space-between; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 16px 2px 6px; }
    .exp-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--card); border-radius: 12px; margin-bottom: 6px; }
    .exp-row .t-main { font-weight: 600; }
    .btn.sm { padding: 8px 12px; font-size: 14px; }
    .line-row.wo { grid-template-columns: 1fr auto 36px; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); }

/* ================= Подразделения ================= */
const UNITS = {
  victoria: { title: 'ООО «Виктория»', icon: '🏢' },
  genshin:  { title: 'Геншин кафе',    icon: '☕' },
};
const MEASURES = ['шт', 'кг', 'г', 'л', 'мл', 'уп', 'порц'];

/* ================= Хранилище =================
   В Telegram — CloudStorage (данные привязаны к аккаунту и видны на всех ваших устройствах).
   В обычном браузере — localStorage (только для проверки).
   CloudStorage ограничивает значение 4096 символами, поэтому JSON режется на куски. */
const Store = (() => {
  const cloud = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage;
  const CHUNK = 4000;
  const cs = cloud ? tg.CloudStorage : null;
  const p = (fn) => new Promise((res, rej) => fn((err, v) => err ? rej(err) : res(v)));
  const get  = (keys) => p(cb => cs.getItems(keys, cb));
  const set  = (k, v) => p(cb => cs.setItem(k, v, cb));
  const del  = (keys) => p(cb => cs.removeItems(keys, cb));
  let queue = Promise.resolve();

  async function load(unit) {
    if (!cloud) {
      try { return JSON.parse(localStorage.getItem('wh_' + unit) || 'null'); } catch (e) { return null; }
    }
    const meta = await get([unit + '_n']);
    const n = parseInt(meta[unit + '_n'] || '0', 10);
    if (!n) return null;
    const keys = Array.from({ length: n }, (_, i) => unit + '_' + i);
    const vals = await get(keys);
    return JSON.parse(keys.map(k => vals[k] || '').join(''));
  }

  async function write(unit, data) {
    const str = JSON.stringify(data);
    if (!cloud) { localStorage.setItem('wh_' + unit, str); return; }
    const old = parseInt((await get([unit + '_n']))[unit + '_n'] || '0', 10);
    const parts = [];
    for (let i = 0; i < str.length; i += CHUNK) parts.push(str.slice(i, i + CHUNK));
    for (let i = 0; i < parts.length; i++) await set(unit + '_' + i, parts[i]);
    await set(unit + '_n', String(parts.length));
    if (old > parts.length) {
      await del(Array.from({ length: old - parts.length }, (_, i) => unit + '_' + (parts.length + i)));
    }
  }

  function save(unit, data) {
    const snapshot = JSON.parse(JSON.stringify(data));
    queue = queue.then(() => write(unit, snapshot)).then(
      () => toast('Сохранено'),
      (e) => { console.error(e); notify('Не удалось сохранить: ' + e); }
    );
    return queue;
  }

  return { load, save, where: cloud ? 'в вашем аккаунте Telegram' : 'в этом браузере (режим проверки)' };
})();

/* ================= Утилиты ================= */
const $app = document.getElementById('app');
const h = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fDate = (s) => s ? s.split('-').reverse().join('.') : '';
const r3 = (n) => Math.round(n * 1000) / 1000;
const num = (s) => { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; };
const fQty = (n) => (n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
const fMoney = (n) => (n || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
const clone = (o) => JSON.parse(JSON.stringify(o));

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}
function notify(msg) { if (inTelegram && tg.showAlert) tg.showAlert(msg); else alert(msg); }
function ask(msg) {
  return new Promise(res => {
    if (inTelegram && tg.showConfirm) tg.showConfirm(msg, ok => res(!!ok));
    else res(confirm(msg));
  });
}
function haptic() { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }

/* ================= Состояние и навигация ================= */
let unitKey = null;
let data = null;            // { items: [], invoices: [], counts: [] }
const stack = [{ view: 'units' }];

function go(view, params = {}) { haptic(); stack.push({ view, ...params }); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function save() { Store.save(unitKey, data); }

if (inTelegram) tg.BackButton.onClick(back);

function render() {
  const r = stack[stack.length - 1];
  if (inTelegram) stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  const backLink = (!inTelegram && stack.length > 1) ? '<button class="back" id="back">‹ Назад</button>' : '';
  $app.innerHTML = backLink;
  const holder = document.createElement('div');
  $app.appendChild(holder);
  VIEWS[r.view](holder, r);
  const b = document.getElementById('back');
  if (b) b.onclick = back;
  window.scrollTo(0, 0);
}

/* ================= Учёт остатков =================
   Остаток = последняя инвентаризация (факт) + накладные − списания после неё.
   Документы упорядочены по дате, затем по времени создания. */
function stockMap(asOf, excludeId) {
  const ev = [];
  data.invoices.forEach(d => ev.push({ t: 'in', d }));
  data.writeoffs.forEach(d => ev.push({ t: 'out', d }));
  data.counts.forEach(d => ev.push({ t: 'cnt', d }));
  ev.sort((a, b) => a.d.date.localeCompare(b.d.date) || a.d.created - b.d.created);
  const s = {};
  for (const { t, d } of ev) {
    if (d.id === excludeId) continue;
    if (asOf && d.date > asOf) continue;
    for (const l of d.lines) {
      if (t === 'in') s[l.itemId] = r3((s[l.itemId] || 0) + l.qty);
      else if (t === 'out') s[l.itemId] = r3((s[l.itemId] || 0) - l.qty);
      else s[l.itemId] = l.actual;
    }
  }
  return s;
}
const itemById = (id) => data.items.find(i => i.id === id);
const itemName = (id) => (itemById(id) || { name: '(удалено)' }).name;
const itemUnit = (id) => (itemById(id) || { unit: '' }).unit;
const invoiceTotal = (d) => d.lines.reduce((a, l) => a + l.qty * l.price, 0);
const itemUsed = (id) => ['invoices', 'writeoffs', 'counts'].some(k => data[k].some(d => d.lines.some(l => l.itemId === id)));
const WRITEOFF_REASONS = ['Продажа', 'Расход на производство', 'Порча / брак', 'Прочее'];

/* ================= Экраны ================= */
const VIEWS = {};

VIEWS.units = (el) => {
  el.innerHTML = `
    <h1>Выберите подразделение</h1>
    <p class="sub">Где вы сегодня работаете?</p>
    ${Object.entries(UNITS).map(([k, u]) => `
      <button class="tile" data-unit="${k}">
        <span class="icon">${u.icon}</span>
        <span class="t-main"><div class="t-name">${h(u.title)}</div></span>
        <span class="arrow">›</span>
      </button>`).join('')}
    <p class="hint" style="margin-top:20px">Данные хранятся ${Store.where}.</p>`;
  el.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => openUnit(b.dataset.unit));
};

async function openUnit(key) {
  haptic();
  unitKey = key;
  $app.innerHTML = '<p class="hint">Загрузка…</p>';
  try {
    data = (await Store.load(key)) || {};
  } catch (e) {
    console.error(e); notify('Не удалось загрузить данные: ' + e); data = {};
  }
  ['items', 'invoices', 'writeoffs', 'counts'].forEach(k => { data[k] = data[k] || []; });
  stack.length = 1;
  stack.push({ view: 'unit' });
  render();
}

VIEWS.unit = (el) => {
  const u = UNITS[unitKey];
  const lastCount = [...data.counts].sort((a, b) => b.date.localeCompare(a.date))[0];
  el.innerHTML = `
    <h1>${h(u.title)}</h1>
    <p class="sub">Выберите раздел</p>
    <button class="tile" data-go="items">
      <span class="icon">📦</span>
      <span class="t-main"><div class="t-name">Номенклатура</div><div class="t-desc">Позиций: ${data.items.length}</div></span>
      <span class="arrow">›</span>
    </button>
    <button class="tile" data-go="report">
      <span class="icon">📊</span>
      <span class="t-main"><div class="t-name">Остатки</div><div class="t-desc">Количество и сумма на складе</div></span>
      <span class="arrow">›</span>
    </button>
    <button class="tile" data-go="invoices">
      <span class="icon">🧾</span>
      <span class="t-main"><div class="t-name">Накладные</div><div class="t-desc">Приход · документов: ${data.invoices.length}</div></span>
      <span class="arrow">›</span>
    </button>
    <button class="tile" data-go="writeoffs">
      <span class="icon">📤</span>
      <span class="t-main"><div class="t-name">Списания</div><div class="t-desc">Расход · документов: ${data.writeoffs.length}</div></span>
      <span class="arrow">›</span>
    </button>
    <button class="tile" data-go="counts">
      <span class="icon">📋</span>
      <span class="t-main"><div class="t-name">Инвентаризация</div>
        <div class="t-desc">${lastCount ? 'Последняя: ' + fDate(lastCount.date) : 'Ещё не проводилась'}</div></span>
      <span class="arrow">›</span>
    </button>
    <button class="tile" data-go="export">
      <span class="icon">📥</span>
      <span class="t-main"><div class="t-name">Выгрузка в Excel</div><div class="t-desc">Остатки, номенклатура, документы</div></span>
      <span class="arrow">›</span>
    </button>`;
  el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
};

/* ---------- Номенклатура ---------- */
VIEWS.items = (el, r) => {
  const stock = stockMap();
  el.innerHTML = `
    <h1>Номенклатура</h1>
    <p class="sub">${h(UNITS[unitKey].title)}</p>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Поиск" value="${h(r.q || '')}">
      <button class="btn" id="add">+ Добавить</button>
    </div>
    <div id="list"></div>`;
  const list = el.querySelector('#list');
  const draw = () => {
    const q = (r.q || '').toLowerCase().trim();
    const items = data.items
      .filter(i => !q || i.name.toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q))
      .sort((a, b) => (a.category || '').localeCompare(b.category || '', 'ru') || a.name.localeCompare(b.name, 'ru'));
    if (!data.items.length) { list.innerHTML = '<div class="empty">Пока нет позиций.<br>Нажмите «Добавить».</div>'; return; }
    if (!items.length) { list.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
    list.innerHTML = items.map(i => `
      <button class="tile" data-id="${i.id}">
        <span class="t-main"><div class="t-name">${h(i.name)}</div>
          <div class="t-desc">${h(i.category || 'Без категории')} · ${fMoney(i.price)} за ${h(i.unit)}</div></span>
        <span class="t-side"><b>${fQty(stock[i.id])}</b> ${h(i.unit)}</span>
      </button>`).join('');
    list.querySelectorAll('[data-id]').forEach(b => b.onclick = () => go('item', { id: b.dataset.id }));
  };
  el.querySelector('#q').oninput = (e) => { r.q = e.target.value; draw(); };
  el.querySelector('#add').onclick = () => go('item', { id: null });
  draw();
};

VIEWS.item = (el, r) => {
  const existing = r.id && itemById(r.id);
  const it = existing ? clone(existing) : { id: uid(), name: '', unit: 'шт', category: '', price: 0 };
  const cats = [...new Set(data.items.map(i => i.category).filter(Boolean))];
  el.innerHTML = `
    <h1>${existing ? 'Позиция' : 'Новая позиция'}</h1>
    <label>Наименование</label>
    <input id="name" value="${h(it.name)}" placeholder="Например: Молоко 3,2%">
    <div class="grid2">
      <div><label>Ед. изм.</label>
        <select id="unit">${MEASURES.map(m => `<option ${m === it.unit ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      <div><label>Цена закупки, ₽</label>
        <input id="price" inputmode="decimal" value="${it.price ? h(it.price) : ''}" placeholder="0"></div>
    </div>
    <label>Категория</label>
    <input id="cat" list="cats" value="${h(it.category)}" placeholder="Например: Молочка">
    <datalist id="cats">${cats.map(c => `<option value="${h(c)}">`).join('')}</datalist>
    <button class="btn wide" id="save">Сохранить</button>
    ${existing ? '<button class="btn danger wide" id="del">Удалить позицию</button>' : ''}`;

  el.querySelector('#save').onclick = () => {
    it.name = el.querySelector('#name').value.trim();
    it.unit = el.querySelector('#unit').value;
    it.category = el.querySelector('#cat').value.trim();
    const p = num(el.querySelector('#price').value || '0');
    if (!it.name) return notify('Введите наименование');
    if (isNaN(p) || p < 0) return notify('Цена указана неверно');
    if (data.items.some(i => i.id !== it.id && i.name.toLowerCase() === it.name.toLowerCase()))
      return notify('Позиция с таким названием уже есть');
    it.price = p;
    const idx = data.items.findIndex(i => i.id === it.id);
    if (idx >= 0) data.items[idx] = it; else data.items.push(it);
    save(); back();
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (itemUsed(it.id)) return notify('Позиция есть в накладных или инвентаризациях — удалить нельзя.');
    if (!(await ask(`Удалить «${it.name}»?`))) return;
    data.items = data.items.filter(i => i.id !== it.id);
    save(); back();
  };
};

/* ---------- Накладные ---------- */
VIEWS.invoices = (el) => {
  const docs = [...data.invoices].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  el.innerHTML = `
    <h1>Накладные</h1>
    <p class="sub">Приход товара · ${h(UNITS[unitKey].title)}</p>
    <button class="btn wide" id="add" style="margin:0 0 12px">+ Новая накладная</button>
    ${docs.length ? docs.map(d => `
      <button class="tile" data-id="${d.id}">
        <span class="t-main"><div class="t-name">№ ${h(d.number || '—')} от ${fDate(d.date)}</div>
          <div class="t-desc">${h(d.supplier || 'Поставщик не указан')} · позиций: ${d.lines.length}</div></span>
        <span class="t-side"><b>${fMoney(invoiceTotal(d))}</b></span>
      </button>`).join('') : '<div class="empty">Накладных пока нет</div>'}`;
  el.querySelector('#add').onclick = () => {
    if (!data.items.length) return notify('Сначала добавьте позиции в номенклатуру.');
    go('invoice', { id: null });
  };
  el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => go('invoice', { id: b.dataset.id }));
};

VIEWS.invoice = (el, r) => {
  const existing = r.id && data.invoices.find(d => d.id === r.id);
  if (!r.draft) {
    r.draft = existing ? clone(existing)
      : { id: uid(), number: String(data.invoices.length + 1), date: today(), supplier: '', lines: [{ itemId: '', qty: '', price: '' }], created: Date.now() };
    r.draft.lines.forEach(l => { l.qty = String(l.qty); l.price = String(l.price); });
  }
  const d = r.draft;
  const suppliers = [...new Set(data.invoices.map(x => x.supplier).filter(Boolean))];
  const items = [...data.items].sort((a, b) => a.name.localeCompare(b.name, 'ru'));

  el.innerHTML = `
    <h1>${existing ? 'Накладная' : 'Новая накладная'}</h1>
    <div class="grid2">
      <div><label>Номер</label><input id="number" value="${h(d.number)}"></div>
      <div><label>Дата</label><input id="date" type="date" value="${h(d.date)}"></div>
    </div>
    <label>Поставщик</label>
    <input id="supplier" list="sup" value="${h(d.supplier)}" placeholder="Название поставщика">
    <datalist id="sup">${suppliers.map(s => `<option value="${h(s)}">`).join('')}</datalist>
    <div class="section-title">Товары</div>
    <div id="lines">${d.lines.map((l, i) => `
      <div class="line" data-i="${i}">
        <select class="l-item">
          <option value="">— выберите товар —</option>
          ${items.map(it => `<option value="${it.id}" ${it.id === l.itemId ? 'selected' : ''}>${h(it.name)} (${h(it.unit)})</option>`).join('')}
        </select>
        <div class="line-row">
          <input class="l-qty" inputmode="decimal" placeholder="Кол-во" value="${h(l.qty)}">
          <input class="l-price" inputmode="decimal" placeholder="Цена" value="${h(l.price)}">
          <span class="l-sum"></span>
          <button class="icon-btn l-del" title="Убрать">✕</button>
        </div>
      </div>`).join('')}</div>
    <button class="btn ghost wide" id="addLine" style="margin-top:4px">+ Добавить строку</button>
    <div class="total"><span>Итого</span><span id="total"></span></div>
    <button class="btn wide" id="save">Сохранить накладную</button>
    ${existing ? '<button class="btn danger wide" id="del">Удалить накладную</button>' : ''}`;

  const recalc = () => {
    let total = 0;
    el.querySelectorAll('.line').forEach(row => {
      const l = d.lines[row.dataset.i];
      const s = num(l.qty) * num(l.price);
      row.querySelector('.l-sum').textContent = isNaN(s) ? '' : fMoney(s);
      if (!isNaN(s)) total += s;
    });
    el.querySelector('#total').textContent = fMoney(total);
  };

  ['number', 'date', 'supplier'].forEach(f => el.querySelector('#' + f).oninput = (e) => { d[f] = e.target.value; });
  const linesEl = el.querySelector('#lines');
  linesEl.oninput = linesEl.onchange = (e) => {
    const row = e.target.closest('.line'); if (!row) return;
    const l = d.lines[row.dataset.i];
    if (e.target.classList.contains('l-item')) {
      l.itemId = e.target.value;
      const it = itemById(l.itemId);
      if (it && !l.price) { l.price = String(it.price || ''); row.querySelector('.l-price').value = l.price; }
    }
    if (e.target.classList.contains('l-qty')) l.qty = e.target.value;
    if (e.target.classList.contains('l-price')) l.price = e.target.value;
    recalc();
  };
  linesEl.onclick = (e) => {
    if (!e.target.classList.contains('l-del')) return;
    d.lines.splice(e.target.closest('.line').dataset.i, 1);
    if (!d.lines.length) d.lines.push({ itemId: '', qty: '', price: '' });
    render();
  };
  el.querySelector('#addLine').onclick = () => { d.lines.push({ itemId: '', qty: '', price: '' }); render(); };

  el.querySelector('#save').onclick = () => {
    if (!d.date) return notify('Укажите дату');
    const lines = [];
    for (const l of d.lines) {
      if (!l.itemId && !l.qty) continue;
      const qty = num(l.qty), price = num(l.price || '0');
      if (!l.itemId) return notify('В одной из строк не выбран товар');
      if (isNaN(qty) || qty <= 0) return notify(`Неверное количество: ${itemById(l.itemId).name}`);
      if (isNaN(price) || price < 0) return notify(`Неверная цена: ${itemById(l.itemId).name}`);
      lines.push({ itemId: l.itemId, qty: r3(qty), price });
    }
    if (!lines.length) return notify('Добавьте хотя бы один товар');
    const doc = { id: d.id, number: d.number.trim(), date: d.date, supplier: d.supplier.trim(), lines, created: d.created };
    const idx = data.invoices.findIndex(x => x.id === doc.id);
    if (idx >= 0) data.invoices[idx] = doc; else data.invoices.push(doc);
    save(); back();
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!(await ask('Удалить накладную? Остатки будут пересчитаны.'))) return;
    data.invoices = data.invoices.filter(x => x.id !== d.id);
    save(); back();
  };
  recalc();
};

/* ---------- Инвентаризация ---------- */
const countDiffs = (d) => d.lines.filter(l => l.actual !== l.expected).length;

VIEWS.counts = (el) => {
  const docs = [...data.counts].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  el.innerHTML = `
    <h1>Инвентаризация</h1>
    <p class="sub">Пересчёт остатков · ${h(UNITS[unitKey].title)}</p>
    <button class="btn wide" id="add" style="margin:0 0 12px">+ Новая инвентаризация</button>
    ${docs.length ? docs.map(d => {
      const diff = countDiffs(d);
      return `
      <button class="tile" data-id="${d.id}">
        <span class="t-main"><div class="t-name">Инвентаризация от ${fDate(d.date)}</div>
          <div class="t-desc">Посчитано позиций: ${d.lines.length}</div></span>
        <span class="t-side ${diff ? 'minus' : 'plus'}">${diff ? 'Расхождений: ' + diff : 'Без расхождений'}</span>
      </button>`; }).join('') : '<div class="empty">Инвентаризаций пока нет</div>'}`;
  el.querySelector('#add').onclick = () => {
    if (!data.items.length) return notify('Сначала добавьте позиции в номенклатуру.');
    go('count', { id: null });
  };
  el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => go('count', { id: b.dataset.id }));
};

VIEWS.count = (el, r) => {
  const existing = r.id && data.counts.find(d => d.id === r.id);
  if (!r.draft) {
    r.draft = existing
      ? { id: existing.id, date: existing.date, created: existing.created,
          actual: Object.fromEntries(existing.lines.map(l => [l.itemId, String(l.actual)])) }
      : { id: uid(), date: today(), created: Date.now(), actual: {} };
  }
  const d = r.draft;
  const items = [...data.items].sort((a, b) => (a.category || '').localeCompare(b.category || '', 'ru') || a.name.localeCompare(b.name, 'ru'));

  el.innerHTML = `
    <h1>${existing ? 'Инвентаризация' : 'Новая инвентаризация'}</h1>
    <div class="grid2">
      <div><label>Дата</label><input id="date" type="date" value="${h(d.date)}"></div>
      <div><label>Поиск</label><input id="q" type="search" placeholder="Товар"></div>
    </div>
    <p class="hint">Введите фактическое количество. Пустые строки не попадут в документ.</p>
    <button class="btn ghost wide" id="fill" style="margin:0 0 12px">Заполнить пустые по учёту</button>
    <div id="rows"></div>
    <div class="total"><span>Расхождений</span><span id="diffs">0</span></div>
    <button class="btn wide" id="save">Провести инвентаризацию</button>
    ${existing ? '<button class="btn danger wide" id="del">Удалить инвентаризацию</button>' : ''}`;

  const rowsEl = el.querySelector('#rows');
  let expected = {};
  const diffText = (id) => {
    const a = num(d.actual[id] ?? '');
    if (isNaN(a)) return '';
    const diff = r3(a - (expected[id] || 0));
    if (!diff) return '<span class="plus">совпадает</span>';
    return `<span class="${diff > 0 ? 'plus' : 'minus'}">${diff > 0 ? '+' : ''}${fQty(diff)}</span>`;
  };
  const countAll = () => {
    el.querySelector('#diffs').textContent = items.filter(i => {
      const a = num(d.actual[i.id] ?? ''); return !isNaN(a) && r3(a - (expected[i.id] || 0)) !== 0;
    }).length;
  };
  const drawRows = () => {
    expected = stockMap(d.date, d.id);
    rowsEl.innerHTML = items.map(i => `
      <div class="cnt-row" data-id="${i.id}" data-name="${h((i.name + ' ' + (i.category || '')).toLowerCase())}">
        <div><div>${h(i.name)}</div>
          <div class="cnt-meta">По учёту: ${fQty(expected[i.id])} ${h(i.unit)} · <span class="d">${diffText(i.id)}</span></div></div>
        <input inputmode="decimal" placeholder="${fQty(expected[i.id])}" value="${h(d.actual[i.id] ?? '')}">
      </div>`).join('');
    applyFilter(); countAll();
  };
  const applyFilter = () => {
    const q = el.querySelector('#q').value.toLowerCase().trim();
    rowsEl.querySelectorAll('.cnt-row').forEach(row => row.style.display = !q || row.dataset.name.includes(q) ? '' : 'none');
  };

  rowsEl.oninput = (e) => {
    const row = e.target.closest('.cnt-row'); if (!row) return;
    const v = e.target.value.trim();
    if (v === '') delete d.actual[row.dataset.id]; else d.actual[row.dataset.id] = v;
    row.querySelector('.d').innerHTML = diffText(row.dataset.id);
    countAll();
  };
  el.querySelector('#q').oninput = applyFilter;
  el.querySelector('#date').onchange = (e) => { d.date = e.target.value; drawRows(); };
  el.querySelector('#fill').onclick = () => {
    items.forEach(i => { if (d.actual[i.id] == null) d.actual[i.id] = String(expected[i.id] || 0); });
    drawRows();
  };

  el.querySelector('#save').onclick = async () => {
    if (!d.date) return notify('Укажите дату');
    const lines = [];
    for (const i of items) {
      if (d.actual[i.id] == null) continue;
      const a = num(d.actual[i.id]);
      if (isNaN(a) || a < 0) return notify(`Неверное количество: ${i.name}`);
      lines.push({ itemId: i.id, expected: expected[i.id] || 0, actual: r3(a) });
    }
    if (!lines.length) return notify('Введите количество хотя бы по одной позиции');
    const later = data.counts.some(c => c.id !== d.id && c.date > d.date);
    if (later && !(await ask('Есть инвентаризация с более поздней датой — эта не изменит текущие остатки. Продолжить?'))) return;
    const doc = { id: d.id, date: d.date, created: d.created, lines };
    const idx = data.counts.findIndex(x => x.id === doc.id);
    if (idx >= 0) data.counts[idx] = doc; else data.counts.push(doc);
    save(); back();
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!(await ask('Удалить инвентаризацию? Остатки будут пересчитаны.'))) return;
    data.counts = data.counts.filter(x => x.id !== d.id);
    save(); back();
  };
  drawRows();
};

VIEWS.report = (el, r) => {
  if (!r.date) r.date = today();
  if (r.nz == null) r.nz = true;
  el.innerHTML = `
    <h1>Остатки</h1>
    <p class="sub">${h(UNITS[unitKey].title)} · сумма по цене закупки</p>
    <div class="grid2">
      <div><label>На дату</label><input id="date" type="date" value="${h(r.date)}"></div>
      <div><label>Поиск</label><input id="q" type="search" placeholder="Товар" value="${h(r.q || '')}"></div>
    </div>
    <label class="chk"><input type="checkbox" id="nz" ${r.nz ? 'checked' : ''}> Скрыть нулевые остатки</label>
    <div id="list"></div>
    <div class="total"><span>Итого на складе</span><span id="sum"></span></div>
    <button class="btn ghost wide" id="xls">📥 Выгрузить остатки в Excel</button>`;
  const list = el.querySelector('#list');
  const draw = () => {
    const stock = stockMap(r.date);
    const q = (r.q || '').toLowerCase().trim();
    const rows = data.items
      .filter(i => !q || i.name.toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q))
      .filter(i => !r.nz || (stock[i.id] || 0) !== 0)
      .sort((a, b) => (a.category || '').localeCompare(b.category || '', 'ru') || a.name.localeCompare(b.name, 'ru'));
    let total = 0, html = '', cat = null, catSum = 0, catHtml = '';
    const flush = () => { if (cat !== null) html += `<div class="cat-head"><span>${h(cat || 'Без категории')}</span><span>${fMoney(catSum)}</span></div>` + catHtml; };
    for (const i of rows) {
      if ((i.category || '') !== cat) { flush(); cat = i.category || ''; catSum = 0; catHtml = ''; }
      const qty = stock[i.id] || 0, sum = qty * (i.price || 0);
      total += sum; catSum += sum;
      catHtml += `<div class="rep-row">
        <span class="t-main"><div>${h(i.name)}</div><div class="cnt-meta">${fMoney(i.price)} за ${h(i.unit)}</div></span>
        <span class="t-side ${qty < 0 ? 'minus' : ''}"><b>${fQty(qty)}</b> ${h(i.unit)}<div class="cnt-meta">${fMoney(sum)}</div></span>
      </div>`;
    }
    flush();
    list.innerHTML = html || '<div class="empty">Нет позиций для отображения</div>';
    el.querySelector('#sum').textContent = fMoney(total);
  };
  el.querySelector('#date').onchange = (e) => { r.date = e.target.value || today(); draw(); };
  el.querySelector('#q').oninput = (e) => { r.q = e.target.value; draw(); };
  el.querySelector('#nz').onchange = (e) => { r.nz = e.target.checked; draw(); };
  el.querySelector('#xls').onclick = () => exportXlsx(['stock'], { asOf: r.date });
  draw();
};

VIEWS.writeoff = (el, r) => {
  const existing = r.id && data.writeoffs.find(d => d.id === r.id);
  if (!r.draft) {
    r.draft = existing ? clone(existing)
      : { id: uid(), date: today(), reason: WRITEOFF_REASONS[0], comment: '', lines: [{ itemId: '', qty: '' }], created: Date.now() };
    r.draft.lines.forEach(l => { l.qty = String(l.qty); });
  }
  const d = r.draft;
  const items = [...data.items].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const stockNow = () => stockMap(d.date, d.id);
  let stock = stockNow();
  const stockHint = (id) => id ? `На складе: ${fQty(stock[id])} ${h(itemUnit(id))}` : '';

  el.innerHTML = `
    <h1>${existing ? 'Списание' : 'Новое списание'}</h1>
    <div class="grid2">
      <div><label>Дата</label><input id="date" type="date" value="${h(d.date)}"></div>
      <div><label>Причина</label>
        <select id="reason">${WRITEOFF_REASONS.map(x => `<option ${x === d.reason ? 'selected' : ''}>${h(x)}</option>`).join('')}</select></div>
    </div>
    <label>Комментарий</label>
    <input id="comment" value="${h(d.comment)}" placeholder="Необязательно">
    <div class="section-title">Товары</div>
    <div id="lines">${d.lines.map((l, i) => `
      <div class="line" data-i="${i}">
        <select class="l-item">
          <option value="">— выберите товар —</option>
          ${items.map(it => `<option value="${it.id}" ${it.id === l.itemId ? 'selected' : ''}>${h(it.name)} (${h(it.unit)})</option>`).join('')}
        </select>
        <div class="line-row wo">
          <input class="l-qty" inputmode="decimal" placeholder="Количество" value="${h(l.qty)}">
          <span class="cnt-meta l-stock">${stockHint(l.itemId)}</span>
          <button class="icon-btn l-del" title="Убрать">✕</button>
        </div>
      </div>`).join('')}</div>
    <button class="btn ghost wide" id="addLine" style="margin-top:4px">+ Добавить строку</button>
    <div class="total"><span>Сумма списания</span><span id="total"></span></div>
    <button class="btn wide" id="save">Провести списание</button>
    ${existing ? '<button class="btn danger wide" id="del">Удалить списание</button>' : ''}`;

  const recalc = () => {
    let total = 0;
    d.lines.forEach(l => { const it = itemById(l.itemId), q = num(l.qty); if (it && !isNaN(q)) total += q * (it.price || 0); });
    el.querySelector('#total').textContent = fMoney(total);
  };
  ['comment', 'reason'].forEach(f => el.querySelector('#' + f).oninput = el.querySelector('#' + f).onchange = (e) => { d[f] = e.target.value; });
  el.querySelector('#date').onchange = (e) => {
    d.date = e.target.value; stock = stockNow();
    el.querySelectorAll('.line').forEach(row => row.querySelector('.l-stock').innerHTML = stockHint(d.lines[row.dataset.i].itemId));
  };
  const linesEl = el.querySelector('#lines');
  linesEl.oninput = linesEl.onchange = (e) => {
    const row = e.target.closest('.line'); if (!row) return;
    const l = d.lines[row.dataset.i];
    if (e.target.classList.contains('l-item')) { l.itemId = e.target.value; row.querySelector('.l-stock').innerHTML = stockHint(l.itemId); }
    if (e.target.classList.contains('l-qty')) l.qty = e.target.value;
    recalc();
  };
  linesEl.onclick = (e) => {
    if (!e.target.classList.contains('l-del')) return;
    d.lines.splice(e.target.closest('.line').dataset.i, 1);
    if (!d.lines.length) d.lines.push({ itemId: '', qty: '' });
    render();
  };
  el.querySelector('#addLine').onclick = () => { d.lines.push({ itemId: '', qty: '' }); render(); };

  el.querySelector('#save').onclick = async () => {
    if (!d.date) return notify('Укажите дату');
    const lines = [], over = [];
    const need = {};
    for (const l of d.lines) {
      if (!l.itemId && !l.qty) continue;
      const qty = num(l.qty);
      if (!l.itemId) return notify('В одной из строк не выбран товар');
      if (isNaN(qty) || qty <= 0) return notify(`Неверное количество: ${itemName(l.itemId)}`);
      const it = itemById(l.itemId);
      lines.push({ itemId: l.itemId, qty: r3(qty), price: it.price || 0 });
      need[l.itemId] = r3((need[l.itemId] || 0) + qty);
    }
    if (!lines.length) return notify('Добавьте хотя бы один товар');
    for (const id in need) if (need[id] > (stock[id] || 0)) over.push(itemName(id));
    if (over.length && !(await ask(`Списывается больше, чем есть на складе: ${over.join(', ')}. Остаток уйдёт в минус. Продолжить?`))) return;
    const doc = { id: d.id, date: d.date, reason: d.reason, comment: d.comment.trim(), lines, created: d.created };
    const idx = data.writeoffs.findIndex(x => x.id === doc.id);
    if (idx >= 0) data.writeoffs[idx] = doc; else data.writeoffs.push(doc);
    save(); back();
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!(await ask('Удалить списание? Остатки будут пересчитаны.'))) return;
    data.writeoffs = data.writeoffs.filter(x => x.id !== d.id);
    save(); back();
  };
  recalc();
};

  },
  counts: {
    title: 'Инвентаризации',
    rows: (o) => [['Дата', 'Товар', 'Ед.', 'По учёту', 'Факт', 'Разница', 'Сумма разницы']].concat(
      docsInRange(data.counts, o).flatMap(d => d.lines.map(l => {
        const diff = r3(l.actual - l.expected);
        return [fDate(d.date), itemName(l.itemId), itemUnit(l.itemId), l.expected, l.actual, diff, r2(diff * ((itemById(l.itemId) || {}).price || 0))];
      }))),
  },
};
function r2(n) { return Math.round(n * 100) / 100; }
function docsInRange(docs, { from, to } = {}) {
  return docs.filter(d => (!from || d.date >= from) && (!to || d.date <= to))
    .sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created);
}

let xlsxLoading = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res;
    s.onerror = () => { xlsxLoading = null; rej(new Error('нет связи с сервером')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

async function exportXlsx(keys, opts = {}) {
  toast('Готовлю файл…');
  try { await loadXlsx(); } catch (e) { return notify('Не удалось загрузить модуль Excel: ' + e.message); }
  const wb = XLSX.utils.book_new();
  for (const k of keys) {
    const rows = SHEETS[k].rows(opts);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map((_, c) => ({ wch: Math.min(40, Math.max(8, ...rows.map(r => String(r[c] ?? '').length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, SHEETS[k].title);
  }
  const name = `${keys.length === 1 ? SHEETS[keys[0]].title : 'Склад'} ${UNITS[unitKey].title.replace(/[«»"]/g, '')} ${fDate(today())}.xlsx`;
  XLSX.writeFile(wb, name);
  if (inTelegram && !['tdesktop', 'macos', 'weba', 'webk', 'web'].includes(tg.platform)) {
    setTimeout(() => toast('Если файл не скачался — нажмите «Копировать»'), 1500);
  }
}

async function copyTable(key, opts = {}) {
  const tsv = SHEETS[key].rows(opts).map(r => r.map(c =>
    typeof c === 'number' ? String(c).replace('.', ',') : String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');
  try {
    await navigator.clipboard.writeText(tsv);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = tsv; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (!ok) return notify('Не удалось скопировать');
  }
  toast('Скопировано — вставьте в Excel или Google Таблицы');
}

VIEWS.export = (el, r) => {
  const o = r.opts || (r.opts = { from: '', to: '', asOf: today() });
  el.innerHTML = `
    <h1>Выгрузка в Excel</h1>
    <p class="sub">${h(UNITS[unitKey].title)}</p>
    <div class="grid2">
      <div><label>Документы с</label><input id="from" type="date" value="${h(o.from)}"></div>
      <div><label>по</label><input id="to" type="date" value="${h(o.to)}"></div>
    </div>
    <p class="hint">Пустые даты — за всё время. Остатки считаются на дату «по» (или на сегодня).</p>
    <button class="btn wide" id="all">📥 Скачать всё одним файлом</button>
    <div class="section-title">По отдельности</div>
    ${Object.entries(SHEETS).map(([k, s]) => `
      <div class="exp-row">
        <span class="t-main">${h(s.title)}</span>
        <button class="btn sm" data-x="${k}">Excel</button>
        <button class="btn sm ghost" data-c="${k}">Копировать</button>
      </div>`).join('')}
    <p class="hint" style="margin-top:14px">На телефоне Telegram иногда не даёт скачивать файлы. Тогда нажмите «Копировать» и вставьте таблицу в Excel или Google Таблицы.</p>`;
  const sync = () => { o.from = el.querySelector('#from').value; o.to = el.querySelector('#to').value; o.asOf = o.to || today(); };
  el.querySelector('#from').onchange = el.querySelector('#to').onchange = sync;
  el.querySelector('#all').onclick = () => { sync(); exportXlsx(Object.keys(SHEETS), o); };
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { sync(); exportXlsx([b.dataset.x], o); });
  el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { sync(); copyTable(b.dataset.c, o); });
};

render();
</script>
