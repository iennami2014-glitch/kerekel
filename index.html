<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --o: 216, 90, 48;
      --accent: #D85A30; --accent-text: #ffffff;
      --accent-soft: rgba(var(--o), .12); --accent-softer: rgba(var(--o), .05);
      --bg: #ffffff; --text: #2a2421; --hint: #8c837d; --card: #f5f2ef; --line: rgba(60, 40, 30, .1);
      --danger: #c8423b; --danger-soft: rgba(200, 66, 59, .12);
      --ok: #2f8a4c; --ok-soft: rgba(47, 138, 76, .12);
      --warn: #8f5d00; --warn-soft: rgba(224, 161, 0, .18);
      --shadow: 0 1px 2px rgba(40, 20, 10, .06), 0 4px 14px rgba(40, 20, 10, .05);
    }
    :root[data-theme="dark"] {
      --o: 236, 122, 80;
      --accent: #EC7A50; --accent-soft: rgba(var(--o), .16); --accent-softer: rgba(var(--o), .06);
      --bg: #1d1a18; --text: #f3eeea; --hint: #9d948e; --card: #2a2623; --line: rgba(255, 255, 255, .08);
      --danger: #f07069; --danger-soft: rgba(240, 112, 105, .16);
      --ok: #5cc27e; --ok-soft: rgba(92, 194, 126, .15);
      --warn: #f0bd55; --warn-soft: rgba(240, 189, 85, .16);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; -webkit-tap-highlight-color: transparent;
    }
    #app { padding: 16px 16px 96px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 4px 0 4px; }
    .sub { color: var(--hint); font-size: 14px; margin: 0 0 16px; }
    .hint { color: var(--hint); font-size: 14px; }
    .back { margin: 0 0 8px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; }
    .tile {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; margin-bottom: 10px;
      background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 14px;
      font: inherit; text-align: left; cursor: pointer;
    }
    .tile:hover { border-color: var(--accent); }
    .tile:active { transform: scale(.985); }
    .icon { flex: 0 0 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--accent); color: var(--accent-text); }
    .t-main { flex: 1; min-width: 0; }
    .t-name { font-weight: 600; }
    .t-desc { color: var(--hint); font-size: 14px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-side { text-align: right; font-size: 14px; white-space: nowrap; }
    .arrow { color: var(--hint); font-size: 22px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid transparent;
      background: var(--card); color: var(--text); font: inherit; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
    .btn {
      padding: 12px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: var(--accent-text); white-space: nowrap;
    }
    .btn.wide { width: 100%; margin-top: 16px; }
    .btn.ghost { background: var(--card); color: var(--accent); }
    .btn.danger { background: none; color: var(--danger); }
    .empty { padding: 28px 16px; border-radius: 14px; background: var(--card); color: var(--hint); text-align: center; }
    .line { background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
    .line select { background: var(--bg); }
    .line-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 6px; align-items: center; margin-top: 6px; }
    .l-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; }
    .l-foot .l-info { min-width: 0; overflow-wrap: anywhere; }
    .sugg { margin: 4px 0 2px; border-radius: 10px; background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.14); overflow: hidden; }
    .sugg[hidden] { display: none; }
    .sugg button { display: block; width: 100%; padding: 11px 12px; border: 0; border-bottom: 1px solid var(--card); background: none; color: var(--text); font: inherit; font-size: 15px; line-height: 1.3; text-align: left; cursor: pointer; }
    .sugg button:last-child { border-bottom: 0; }
    .sugg button:active { background: var(--card); }
    .line-row input { background: var(--bg); padding: 9px 10px; }
    .l-sum { flex: 0 0 auto; font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap; }
    .icon-btn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--danger); font-size: 18px; cursor: pointer; }
    .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin: 14px 2px 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cnt-row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; padding: 10px; background: var(--card); border-radius: 12px; margin-bottom: 6px; }
    .cnt-row input { background: var(--bg); text-align: right; padding: 9px 10px; }
    .cnt-meta { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .plus { color: var(--ok); } .minus { color: var(--danger); }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 2px 8px; }
    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 8px 14px; border-radius: 20px;
      background: rgba(0,0,0,.75); color: #fff; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    .chk { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; margin: 12px 2px; }
    .chk input { width: 20px; height: 20px; margin: 0; }
    .rep-row { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--card); border-radius: 10px; margin-bottom: 4px; }
    .rep-row .t-main div:first-child { overflow-wrap: anywhere; }
    .cat-head { display: flex; justify-content: space-between; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 16px 2px 6px; }
    .exp-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--card); border-radius: 12px; margin-bottom: 6px; }
    .exp-row .t-main { font-weight: 600; }
    .btn.sm { padding: 8px 12px; font-size: 14px; }
    .line-row.wo { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 36px; }
    .tile.off { opacity: .55; }
    .line input.l-prod { background: var(--bg); }
    .btn:disabled { opacity: .6; cursor: default; }
    .tile.static { cursor: default; }
    h1 { padding-right: 44px; }
    .qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0 4px; }
    .qa button {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      min-height: 98px; padding: 12px 6px; border: 0; border-radius: 16px; cursor: pointer;
      background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; font-size: 14px; line-height: 1.2; text-align: center;
    }
    .qa button .e { font-size: 30px; line-height: 1; }
    .qa button:active { transform: scale(.97); }
    .search { position: relative; margin: 0 0 12px; }
    .search input { padding-left: 40px; }
    .search::before { content: "🔍"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .55; pointer-events: none; }
    .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; padding: 8px 14px; border: 0; border-radius: 18px; background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
    .chip.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .date-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 2px 6px; font-weight: 700; font-size: 15px; }
    .date-head span:last-child { color: var(--hint); font-weight: 500; font-size: 13px; text-align: right; }
    .st { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; margin-top: 5px; margin-right: 4px; }
    .st.new { background: #fff1c7; color: #7a5600; }
    .st.done { background: #dff3e5; color: #1e7034; }
    .st.tg { background: #e3eefc; color: #1d5fae; }
    .help-fab { position: absolute; top: 10px; right: 12px; z-index: 5; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); color: var(--accent); font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,.15); }
    .help { background: var(--card); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; font-size: 15px; line-height: 1.45; }
    .help b { display: block; margin-bottom: 4px; font-size: 16px; }
    .help ol { margin: 6px 0 0; padding-left: 20px; }
    .help .btn { margin-top: 10px; }
    .banner { display: flex; gap: 10px; align-items: center; background: #fff1c7; color: #5c4300; border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; line-height: 1.35; }
    .banner .btn { margin-left: auto; flex: 0 0 auto; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-bottom: 12px; }
    .kv > div:nth-child(odd) { color: var(--hint); }
    .kv > div { overflow-wrap: anywhere; }
    .tile.doc { padding: 10px 12px; gap: 12px; margin-bottom: 8px; }
    .tile.doc .icon { flex-basis: 38px; height: 38px; font-size: 19px; border-radius: 10px; }
    .tile.doc .t-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile.doc .t-side .st { margin: 4px 0 0; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--accent); color: var(--accent-text); vertical-align: middle; margin-left: 6px; }
    .sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .15s; }
    .sheet-bg.show { opacity: 1; }
    .sheet { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(24px); transition: transform .15s; }
    .sheet-bg.show .sheet { transform: none; }
    .sheet h2 { margin: 0 0 4px; font-size: 21px; padding-right: 40px; }
    .sheet-x { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--card); color: var(--hint); font-size: 15px; cursor: pointer; }
    .pick button { display: flex; gap: 14px; align-items: center; width: 100%; padding: 16px; margin-bottom: 10px; border: 2px solid transparent; border-radius: 16px; background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .pick button:active { transform: scale(.985); border-color: var(--accent); }
    .pick .e { flex: 0 0 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: var(--accent); font-size: 28px; }
    .pick b { display: block; font-size: 17px; }
    .pick small { display: block; margin-top: 3px; color: var(--hint); font-size: 13px; line-height: 1.35; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; margin: 14px 0 10px; border-radius: 12px; background: var(--card); }
    .seg button { padding: 10px 6px; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
    .seg.s3 { grid-template-columns: repeat(3, 1fr); }
    .seg.s4 { grid-template-columns: repeat(4, 1fr); }
    .seg.s4 button { padding: 9px 2px; font-size: 13px; }
    .pchart { margin: 12px 0; padding: 10px 12px; border-radius: 12px; background: var(--card); }
    .pchart svg { display: block; width: 100%; height: 150px; }
    .pchart-y, .pchart-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--hint); }
    .pchart-y { margin-bottom: 4px; }
    .pchart-x { margin-top: 4px; }
    .pchart-leg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 13px; }
    .pchart-leg i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; }
    .fc { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; }
    .h-date { font-weight: 500; color: var(--hint); font-size: .75em; white-space: nowrap; }
    .banner .btn.danger { color: var(--danger); }
    .inv-row.no-ttk .t-main > div:first-child { color: var(--hint); }
    .ttk-head { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px; margin: 12px 0; border-radius: 12px; background: var(--card); font-size: 14px; color: var(--hint); }
    .ttk-head b { color: var(--text); }
    .ttk-yield { flex-basis: 100%; }
    .ttk-skip { display: block; margin-top: 2px; font-size: 12px; }
    .ttk-tech { white-space: pre-line; padding: 12px; border-radius: 12px; background: var(--card); font-size: 14px; }
    .ttk-ed { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; margin-bottom: 6px; border-left: 4px solid transparent; border-radius: 12px; background: var(--card); }
    .ttk-ed.bad { border-left-color: var(--danger); }
    .ttk-ed .t-main { flex: 1; min-width: 0; }
    .ttk-ed .amt { flex: 0 0 80px; width: 80px; margin: 0; padding: 8px; text-align: right; background: var(--bg); }
    .ttk-ed .u { flex: 0 0 34px; font-size: 13px; color: var(--hint); }
    .ttk-ed .ic { flex: 0 0 34px; height: 34px; padding: 0; border: 0; border-radius: 10px; background: var(--bg); color: var(--text); font-size: 15px; cursor: pointer; }
    .ttk-diff { padding: 10px 12px; border-radius: 12px; background: var(--card); line-height: 1.7; }
    .pick-list { max-height: 55vh; overflow-y: auto; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; }
    .seg button.on { background: var(--accent); color: var(--accent-text); }
    .seg small { font-weight: 500; opacity: .8; }
    .inv-tools { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-top: 12px; }
    .grp { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; margin-bottom: 6px; border: 0; border-radius: 12px; background: var(--card); color: var(--text); font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
    .grp .cnt { color: var(--hint); font-weight: 500; font-size: 14px; }
    .grp.full .cnt { color: var(--ok); font-weight: 700; }
    .grp .arrow { transition: transform .15s; }
    .grp.open .arrow { transform: rotate(90deg); }
    .grp-body { margin: 0 0 12px 8px; padding-left: 8px; border-left: 2px solid var(--card); }
    .inv-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin: 0 0 6px; border: 0; border-left: 4px solid transparent; border-radius: 12px; background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .inv-row.done { border-left-color: var(--ok); }
    .inv-row:active { transform: scale(.985); }
    .inv-val { text-align: right; font-weight: 700; white-space: nowrap; }
    .inv-val.empty { color: var(--accent); font-weight: 500; font-size: 14px; }
    .inv-val small { display: block; max-width: 120px; overflow: hidden; text-overflow: ellipsis; color: var(--hint); font-weight: 400; font-size: 12px; }
    .inv-bar { position: sticky; bottom: 0; z-index: 3; display: flex; gap: 12px; align-items: center; margin: 14px -16px 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 var(--card); font-size: 13px; color: var(--hint); line-height: 1.2; }
    .inv-bar b { color: var(--text); font-size: 18px; }
    .inv-bar .btn { flex: 1; }
    .calc-name { font-weight: 700; font-size: 19px; padding-right: 40px; }
    .calc-expr { margin-top: 12px; padding: 12px 14px; font-size: 28px; font-weight: 600; text-align: right; }
    .calc-res { min-height: 24px; margin: 6px 4px 10px; color: var(--hint); font-size: 18px; text-align: right; }
    .calc-res.ok { color: var(--ok); font-weight: 700; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .keys button { height: 54px; border: 0; border-radius: 12px; background: var(--card); color: var(--text); font: inherit; font-size: 22px; cursor: pointer; user-select: none; }
    .keys button.op { color: var(--accent); font-weight: 700; }
    .keys button:active { transform: scale(.95); background: var(--accent); color: var(--accent-text); }
    .calc-act { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 6px; margin-top: 10px; }
    .rv { margin-bottom: 8px; padding: 10px; border-left: 4px solid var(--ok); border-radius: 12px; background: var(--card); }
    .rv.warn { border-left-color: #e0a100; }
    .rv.none { border-left-color: var(--danger); }
    .rv.off { opacity: .55; }
    .rv-src { display: flex; justify-content: space-between; gap: 8px; color: var(--hint); font-size: 13px; overflow-wrap: anywhere; }
    .rv-row { display: grid; grid-template-columns: 1fr 84px 28px; gap: 6px; align-items: center; margin-top: 6px; }
    .rv-row input { background: var(--bg); padding: 9px 10px; }
    .rv-row input[type=checkbox] { width: 22px; height: 22px; margin: 0; }
    .spin { width: 40px; height: 40px; margin: 14px auto; border: 4px solid var(--card); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pick .e { background: var(--accent-soft); color: var(--accent); }
    .pick .e .ico { width: 26px; height: 26px; }
    /* ===== Новый дизайн: иконки, каркас, главная ===== */
    body { font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
    .ico { display: inline-block; width: 1.15em; height: 1.15em; flex: 0 0 auto; vertical-align: -0.2em; background: currentColor;
      -webkit-mask: var(--ic) center / contain no-repeat; mask: var(--ic) center / contain no-repeat; }
    .icon .ico { width: 22px; height: 22px; }
    .icon { background: var(--accent-soft); color: var(--accent); }
    .tile { background: var(--card); border: 1px solid transparent; }
    .tile:hover { border-color: var(--line); }
    .btn.ghost { background: var(--accent-soft); color: var(--accent); }
    .chip.on { background: var(--accent-soft); color: var(--accent); }
    .seg button.on { background: var(--bg); color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
    .banner { background: var(--warn-soft); color: var(--text); }
    .st.new { background: var(--warn-soft); color: var(--warn); }
    .st.done { background: var(--ok-soft); color: var(--ok); }
    .st.tg { background: var(--accent-soft); color: var(--accent); }
    .help { border-left-color: var(--accent); }
    .search::before { content: ""; width: 16px; height: 16px; background: var(--hint); opacity: 1;
      -webkit-mask: url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/search.svg) center / contain no-repeat;
      mask: url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/search.svg) center / contain no-repeat; }
    h1 { font-weight: 700; letter-spacing: -.01em; }

    body.shell-on #app { max-width: none; padding: 0; }
    .side { display: none; }
    .topbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
    .depseg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--card); min-width: 0; }
    .depseg button { padding: 6px 12px; border: 0; border-radius: 8px; background: none; color: var(--hint); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .depseg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
    .today { color: var(--hint); font-size: 14px; white-space: nowrap; }
    .searchbox { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 10px; background: var(--card); color: var(--hint); font: inherit; font-size: 14px; cursor: pointer; }
    .searchbox span, .searchbox kbd { display: none; }
    .searchbox kbd { font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
    .view { position: relative; max-width: 760px; margin: 0 auto; padding: 14px 16px calc(96px + env(safe-area-inset-bottom)); }

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); }

/* ================= Подразделения ================= */
const UNITS = {
  victoria: { title: 'ООО «Виктория»', icon: '🏢', iiko: true },
  genshin:  { title: 'Геншин кафе',    icon: '☕' },
};
const MEASURES = ['шт', 'кг', 'г', 'л', 'мл', 'уп', 'порц'];

/* ================= Хранилище =================
   В Telegram — CloudStorage (данные привязаны к аккаунту и видны на всех ваших устройствах).
   В обычном браузере — localStorage (только для проверки).
   CloudStorage ограничивает значение 4096 символами, поэтому JSON режется на куски. */
const Store = (() => {
  const cloud = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage;
  const CHUNK = 4000;
  const cs = cloud ? tg.CloudStorage : null;
  const p = (fn) => new Promise((res, rej) => fn((err, v) => err ? rej(err) : res(v)));
  const get  = (keys) => p(cb => cs.getItems(keys, cb));
  const set  = (k, v) => p(cb => cs.setItem(k, v, cb));
  const del  = (keys) => p(cb => cs.removeItems(keys, cb));
  let queue = Promise.resolve();

  async function load(unit) {
    if (!cloud) {
      try { return JSON.parse(localStorage.getItem('wh_' + unit) || 'null'); } catch (e) { return null; }
    }
    const meta = await get([unit + '_n']);
    const n = parseInt(meta[unit + '_n'] || '0', 10);
    if (!n) return null;
    const keys = Array.from({ length: n }, (_, i) => unit + '_' + i);
    const vals = await get(keys);
    return JSON.parse(keys.map(k => vals[k] || '').join(''));
  }

  async function write(unit, data) {
    const str = JSON.stringify(data);
    if (!cloud) { localStorage.setItem('wh_' + unit, str); return; }
    const old = parseInt((await get([unit + '_n']))[unit + '_n'] || '0', 10);
    const parts = [];
    for (let i = 0; i < str.length; i += CHUNK) parts.push(str.slice(i, i + CHUNK));
    for (let i = 0; i < parts.length; i++) await set(unit + '_' + i, parts[i]);
    await set(unit + '_n', String(parts.length));
    if (old > parts.length) {
      await del(Array.from({ length: old - parts.length }, (_, i) => unit + '_' + (parts.length + i)));
    }
  }

  function save(unit, data) {
    const snapshot = JSON.parse(JSON.stringify(data));
    queue = queue.then(() => write(unit, snapshot)).then(
      () => toast('Сохранено'),
      (e) => { console.error(e); notify('Не удалось сохранить: ' + e); }
    );
    return queue;
  }

  return { load, save, where: cloud ? 'в вашем аккаунте Telegram' : 'в этом браузере (режим проверки)' };
})();

/* ================= Сервер iiko =================
   Адрес сервера приходит в параметре ?api=… (его подставляет бот при запуске сервера). */
const API_URL = (() => {
  const fromUrl = new URLSearchParams(location.search).get('api') || '';
  try {
    if (fromUrl) localStorage.setItem('apiUrl', fromUrl);
    return fromUrl || localStorage.getItem('apiUrl') || '';
  } catch (e) { return fromUrl; }
})();

async function api(path, body) {
  if (!API_URL) throw new Error('Адрес сервера неизвестен. Откройте приложение кнопкой «Склад» в чате с ботом.');
  const opts = { headers: { 'X-Init-Data': (tg && tg.initData) || '' } };
  if (body !== undefined) {
    opts.method = 'POST';
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const ctrl = window.AbortController ? new AbortController() : null;
  if (ctrl) opts.signal = ctrl.signal;
  const timer = ctrl && setTimeout(() => ctrl.abort(), body !== undefined ? 90000 : 45000);
  let r;
  try {
    r = await fetch(API_URL + path, opts);
  } catch (e) {
    const host = API_URL.replace(/^https?:\/\//, '');
    throw new Error((e && e.name === 'AbortError' ? 'Сервер слишком долго не отвечает.' : 'Сервер на компьютере не отвечает.')
      + ' Проверьте, что запущен start.cmd. Затем полностью закройте приложение и откройте его кнопкой «Склад» слева от поля ввода'
      + ' (не кнопкой из старого сообщения).\nАдрес сервера: ' + host);
  } finally {
    if (timer) clearTimeout(timer);
  }
  let data = null;
  try { data = await r.json(); } catch (e) { /* не JSON */ }
  if (!r.ok) throw new Error((data && data.error) || ('Ошибка сервера ' + r.status));
  return data;
}

/* ================= Утилиты ================= */
const $app = document.getElementById('app');
const h = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fDate = (s) => s ? s.split('-').reverse().join('.') : '';
const r3 = (n) => Math.round(n * 1000) / 1000;
const num = (s) => { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; };
const fQty = (n) => (n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
const fMoney = (n) => (n || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
const clone = (o) => JSON.parse(JSON.stringify(o));

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}
function notify(msg) { if (inTelegram && tg.showAlert) tg.showAlert(msg); else alert(msg); }
function ask(msg) {
  return new Promise(res => {
    if (inTelegram && tg.showConfirm) tg.showConfirm(msg, ok => res(!!ok));
    else res(confirm(msg));
  });
}
function haptic() { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }

/* ================= Даты, поиск, подсказки, черновики ================= */
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
function isoShift(days) {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function dateLabel(iso) {
  if (!iso) return 'Без даты';
  if (iso === today()) return 'Сегодня';
  if (iso === isoShift(-1)) return 'Вчера';
  const [y, m, d] = iso.split('-').map(Number);
  const wd = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  return `${d} ${MONTHS[m - 1]}${y !== new Date().getFullYear() ? ' ' + y : ''}, ${wd}`;
}
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}
/* Список, разбитый по дням: «Сегодня», «Вчера», «10 ноября, понедельник» */
function groupByDate(list, getDate, renderItem, sumOf) {
  let html = '', cur = null, buf = '', total = 0, n = 0;
  const flush = () => {
    if (cur === null) return;
    html += `<div class="date-head"><span>${dateLabel(cur)}</span><span>${n} ${plural(n, 'документ', 'документа', 'документов')}${sumOf && total ? ' · ' + fMoney(total) : ''}</span></div>` + buf;
  };
  list.forEach((x, i) => {
    const d = getDate(x);
    if (d !== cur) { flush(); cur = d; buf = ''; total = 0; n = 0; }
    buf += renderItem(x, i); n++;
    if (sumOf) total += sumOf(x) || 0;
  });
  flush();
  return html;
}
const PERIODS = [['today', 'Сегодня'], ['week', '7 дней'], ['month', '30 дней'], ['custom', 'Свой период']];
function periodRange(r) {
  if (r.period === 'today') return { from: today(), to: today() };
  if (r.period === 'month') return { from: isoShift(-29), to: today() };
  if (r.period === 'custom') return { from: r.from || isoShift(-6), to: r.to || today() };
  return { from: isoShift(-6), to: today() };
}
const chipsHtml = (list, cur, attr) =>
  `<div class="chips">${list.map(([k, l]) => `<button class="chip ${k === cur ? 'on' : ''}" data-${attr}="${k}">${l}</button>`).join('')}</div>`;
const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/ё/g, 'е');
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* нет хранилища */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* нет хранилища */ } }

/* Подсказки: показываются один раз на каждом экране, потом — по кнопке «?» */
const HELP = {
  units: ['С чего начать', 'Выберите, где работаете.<br>«ООО «Виктория»» — данные прямо из iiko: товары, остатки, документы.<br>«Геншин кафе» — учёт внутри приложения.'],
  ikDeps: ['Заведения', 'Выберите заведение. У каждого свои склады: бар, кухня, хозтовары.'],
  ikHome: ['Главная', '<ol><li>Сверху — цифры за вчера: выручка, фудкост, списания, цены. Нажмите на карточку, чтобы открыть подробности.</li><li>«Требует внимания» — что стоит проверить сегодня.</li><li>Новый документ — кнопки «Приход», «Списание», «Инвентаризация» (на телефоне — оранжевая «+»).</li><li>Заведение переключается вверху, разделы — в меню.</li></ol>Всё, что вы отправляете, попадает в iiko <b style="display:inline">непроведённым</b>: его проверяют и проводят в iikoOffice.'],
  ikItems: ['Номенклатура', 'Все товары из iiko и сколько их сейчас на складах заведения. Ищите по названию, группе или артикулу.'],
  ikStock: ['Остатки', 'Сколько товара на складе на выбранную дату. Можно смотреть по одному складу или по всем сразу. Красным — товары в минусе: обычно это значит, что не заведён приход.'],
  ikJournal: ['Журнал документов', 'Все приходы и списания заведения из iiko и инвентаризации из приложения — по дням. Сверху выберите период, ниже — поиск по номеру, поставщику или товару. Нажмите на документ, чтобы посмотреть состав или повторить его.'],
  ikDocs: ['Документы', 'Документы этого вида по дням. Кнопка сверху создаёт новый.'],
  ikDocView: ['Состав документа', '«Повторить» создаст новый документ с теми же товарами и количествами — удобно для регулярных закупок. Изменить или провести документ можно в iikoOffice.'],
  ikDoc: (r) => r.type === 'invoice'
    ? ['Приход товара (накладная)', '<ol><li>Выберите склад, куда пришёл товар, и поставщика.</li><li>Добавьте товары: начните вводить название и выберите из подсказок.</li><li>Количество — в единицах товара (кг, л, шт), цена — за одну такую единицу.</li><li>Нажмите «Отправить в iiko».</li></ol>Черновик сохраняется сам — можно выйти и вернуться позже.']
    : r.type === 'writeoff'
      ? ['Списание', 'Списание — когда товар ушёл со склада не через продажу: порча, питание персонала, представительские.<ol><li>Выберите склад и статью.</li><li>Добавьте товары и количество.</li><li>Нажмите «Отправить в iiko».</li></ol>Рядом с товаром видно, сколько его на складе. Черновик сохраняется сам.']
      : ['Инвентаризация', '<ol><li>Выберите склад и вкладку: «Товары» или «Заготовки». Показываются только позиции этого склада; остальные — фильтр «Все позиции».</li><li>Откройте группу и нажмите на позицию — появится калькулятор. Можно писать «(12+3)*8» или считать частями «12+3+5».</li><li>«Дальше ›» сразу открывает следующую позицию.</li><li>«Бланк» — скачать таблицу всех позиций, «Excel» — загрузить заполненную таблицу обратно.</li></ol>Пустые позиции не отправляются. Черновик сохраняется сам — считать можно в несколько заходов.'],

};
function helpFor(r) { const x = HELP[r.view]; return typeof x === 'function' ? x(r) : x; }

/* Черновики документов iiko: сохраняются в телефоне, пока документ не отправлен */
const draftKey = (type) => `draft_${IK.dep ? IK.dep.id : ''}_${type}`;
function loadDraft(type) { try { return JSON.parse(lsGet(draftKey(type)) || 'null'); } catch (e) { return null; } }
function saveDraft(type, d) { lsSet(draftKey(type), JSON.stringify({ ...d, savedAt: Date.now() })); }
function clearDraft(type) { lsDel(draftKey(type)); }

/* ================= Состояние и навигация ================= */
let unitKey = null;
let data = null;            // { items: [], invoices: [], counts: [] }
const stack = [{ view: 'units' }];

function go(view, params = {}) { haptic(); stack.push({ view, ...params }); render(); }
function back() { if (closeTopSheet()) return; if (stack.length > 1) { stack.pop(); render(); } }
function save() { Store.save(unitKey, data); }

if (inTelegram) tg.BackButton.onClick(back);

function render() {
  const r = stack[stack.length - 1];
  const shell = inShell();
  document.body.classList.toggle('shell-on', shell);
  const showBack = shell ? !atSectionRoot() : stack.length > 1;
  if (inTelegram) showBack ? tg.BackButton.show() : tg.BackButton.hide();
  let box = $app;
  if (shell) { $app.innerHTML = shellHtml(r); bindShell(); box = $app.querySelector('#view'); } else $app.innerHTML = '';
  if (!inTelegram && showBack) box.insertAdjacentHTML('beforeend', '<button class="back" id="back">‹ Назад</button>');
  const help = helpFor(r);
  if (help) {
    const seenKey = 'help_' + r.view + (r.type ? '_' + r.type : '');
    const card = document.createElement('div');
    card.className = 'help';
    card.innerHTML = `<b>${help[0]}</b>${help[1]}<br><button class="btn sm ghost">Понятно</button>`;
    card.style.display = lsGet(seenKey) ? 'none' : '';
    card.querySelector('button').onclick = () => { card.style.display = 'none'; lsSet(seenKey, '1'); };
    box.appendChild(card);
    const fab = document.createElement('button');
    fab.className = 'help-fab'; fab.textContent = '?'; fab.title = 'Подсказка';
    fab.onclick = () => { const hidden = card.style.display === 'none'; card.style.display = hidden ? '' : 'none'; if (hidden) window.scrollTo(0, 0); };
    box.appendChild(fab);
  }
  const holder = document.createElement('div');
  box.appendChild(holder);
  VIEWS[r.view](holder, r);
  const b = document.getElementById('back');
  if (b) b.onclick = back;
  window.scrollTo(0, 0);
}

/* ================= Учёт остатков =================
   Остаток = последняя инвентаризация (факт) + накладные − списания после неё.
   Документы упорядочены по дате, затем по времени создания. */
function stockMap(asOf, excludeId) {
  const ev = [];
  data.invoices.forEach(d => ev.push({ t: 'in', d }));
  data.writeoffs.forEach(d => ev.push({ t: 'out', d }));
  data.counts.forEach(d => ev.push({ t: 'cnt', d }));
  ev.sort((a, b) => a.d.date.localeCompare(b.d.date) || a.d.created - b.d.created);
  const s = {};
  for (const { t, d } of ev) {
    if (d.id === excludeId) continue;
    if (asOf && d.date > asOf) continue;
    for (const l of d.lines) {
      if (t === 'in') s[l.itemId] = r3((s[l.itemId] || 0) + l.qty);
      else if (t === 'out') s[l.itemId] = r3((s[l.itemId] || 0) - l.qty);
      else s[l.itemId] = l.actual;
    }
  }
  return s;
}
const itemById = (id) => data.items.find(i => i.id === id);
const itemName = (id) => (itemById(id) || { name: '(удалено)' }).name;
const itemUnit = (id) => (itemById(id) || { unit: '' }).unit;
const invoiceTotal = (d) => d.lines.reduce((a, l) => a + l.qty * l.price, 0);
const itemUsed = (id) => ['invoices', 'writeoffs', 'counts'].some(k => data[k].some(d => d.lines.some(l => l.itemId === id)));
const WRITEOFF_REASONS = ['Продажа', 'Расход на производство', 'Порча / брак', 'Прочее'];

  haptic();

  if (UNITS[key].iiko) {
    stack.length = 1;
    stack.push({ view: 'ikDeps' });

  $app.innerHTML = '<p class="hint">Загрузка…</p>';
  try {
    data = (await Store.load(key)) || {};
  } catch (e) {
    console.error(e); notify('Не удалось загрузить данные: ' + e); data = {};

  ['items', 'invoices', 'writeoffs', 'counts'].forEach(k => { data[k] = data[k] || []; });

  stack.push({ view: 'unit' });
  render();

function localDocList(el, r, o) {
  const docs = [...o.docs].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  el.innerHTML = `
    <h1>${o.title}</h1>
    <p class="sub">${o.sub} · ${h(UNITS[unitKey].title)}</p>
    <button class="btn wide" id="add" style="margin:0 0 12px">${o.addLabel}</button>
    ${docs.length ? `<div class="search"><input id="q" type="search" placeholder="${o.searchHint}" value="${h(r.q || '')}"></div>` : ''}
    <div id="list"></div>`;
  const list = el.querySelector('#list');
  const draw = () => {
    const q = norm(r.q).trim();
    const shown = q ? docs.filter(d => norm(o.text(d) + ' ' + d.lines.map(l => itemName(l.itemId)).join(' ')).includes(q)) : docs;
    list.innerHTML = shown.length ? groupByDate(shown, d => d.date, o.card, o.sum)
      : `<div class="empty">${docs.length ? 'Ничего не найдено' : o.empty}</div>`;
    list.querySelectorAll('[data-id]').forEach(b => b.onclick = () => go(o.view, { id: b.dataset.id }));
  };
  const q = el.querySelector('#q');
  if (q) q.oninput = (e) => { r.q = e.target.value; draw(); };
  el.querySelector('#add').onclick = () => {
    if (!data.items.length) return notify('Сначала добавьте позиции в номенклатуру.');
    go(o.view, { id: null });
  };
  draw();
}

      <div><label>Номер</label><input id="number" value="${h(d.number)}"></div>

    <div id="lines">${d.lines.map((l, i) => `
      <div class="line" data-i="${i}">
        <select class="l-item">
          <option value="">— выберите товар —</option>

          <input class="l-qty" inputmode="decimal" placeholder="Кол-во" value="${h(l.qty)}">
          <input class="l-price" inputmode="decimal" placeholder="Цена за ед." value="${h(l.price)}">
          <button class="icon-btn l-del" title="Убрать">✕</button>
        </div>
        <div class="l-foot"><span></span><span class="l-sum"></span></div>
      </div>`).join('')}</div>
    <button class="btn ghost wide" id="addLine" style="margin-top:4px">+ Добавить строку</button>
    <div class="total"><span>Итого</span><span id="total"></span></div>
    <button class="btn wide" id="save">Сохранить накладную</button>
    ${existing ? '<button class="btn danger wide" id="del">Удалить накладную</button>' : ''}`;
  attachSuggest(el.querySelector('#supplier'), () => suppliers);

  const recalc = () => {
    let total = 0;
    el.querySelectorAll('.line').forEach(row => {
      const l = d.lines[row.dataset.i];
      const s = num(l.qty) * num(l.price);
      row.querySelector('.l-sum').textContent = isNaN(s) ? '' : fMoney(s);
      if (!isNaN(s)) total += s;
    });
    el.querySelector('#total').textContent = fMoney(total);
  };

  ['number', 'date', 'supplier'].forEach(f => el.querySelector('#' + f).oninput = (e) => { d[f] = e.target.value; });
  const linesEl = el.querySelector('#lines');
  linesEl.oninput = linesEl.onchange = (e) => {
    const row = e.target.closest('.line'); if (!row) return;
    const l = d.lines[row.dataset.i];
    if (e.target.classList.contains('l-item')) {
      l.itemId = e.target.value;
      const it = itemById(l.itemId);
      if (it && !l.price) { l.price = String(it.price || ''); row.querySelector('.l-price').value = l.price; }
    }
    if (e.target.classList.contains('l-qty')) l.qty = e.target.value;
    if (e.target.classList.contains('l-price')) l.price = e.target.value;
    recalc();
  };
  linesEl.onclick = (e) => {
    if (!e.target.classList.contains('l-del')) return;
    d.lines.splice(e.target.closest('.line').dataset.i, 1);
    if (!d.lines.length) d.lines.push({ itemId: '', qty: '', price: '' });
    render();
  };
  el.querySelector('#addLine').onclick = () => { d.lines.push({ itemId: '', qty: '', price: '' }); render(); };

  el.querySelector('#save').onclick = () => {
    if (!d.date) return notify('Укажите дату');
    const lines = [];
    for (const l of d.lines) {
      if (!l.itemId && !l.qty) continue;
      const qty = num(l.qty), price = num(l.price || '0');
      if (!l.itemId) return notify('В одной из строк не выбран товар');
      if (isNaN(qty) || qty <= 0) return notify(`Неверное количество: ${itemById(l.itemId).name}`);
      if (isNaN(price) || price < 0) return notify(`Неверная цена: ${itemById(l.itemId).name}`);
      lines.push({ itemId: l.itemId, qty: r3(qty), price });
    }
    if (!lines.length) return notify('Добавьте хотя бы один товар');
    const doc = { id: d.id, number: d.number.trim(), date: d.date, supplier: d.supplier.trim(), lines, created: d.created };
    const idx = data.invoices.findIndex(x => x.id === doc.id);
    if (idx >= 0) data.invoices[idx] = doc; else data.invoices.push(doc);
    save(); back();
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!(await ask('Удалить накладную? Остатки будут пересчитаны.'))) return;
    data.invoices = data.invoices.filter(x => x.id !== d.id);
    save(); back();
  };
  recalc();
};

    const a = num(d.actual[id] ?? '');
    if (isNaN(a)) return '';
    const diff = r3(a - (expected[id] || 0));
    if (!diff) return '<span class="plus">совпадает</span>';
    return `<span class="${diff > 0 ? 'plus' : 'minus'}">${diff > 0 ? '+' : ''}${fQty(diff)}</span>`;
  };
  const countAll = () => {
    el.querySelector('#diffs').textContent = items.filter(i => {
      const a = num(d.actual[i.id] ?? ''); return !isNaN(a) && r3(a - (expected[i.id] || 0)) !== 0;
    }).length;
  };
  const drawRows = () => {
    expected = stockMap(d.date, d.id);
    rowsEl.innerHTML = items.map(i => `
      <div class="cnt-row" data-id="${i.id}" data-name="${h((i.name + ' ' + (i.category || '')).toLowerCase())}">
        <div><div>${h(i.name)}</div>
          <div class="cnt-meta">По учёту: ${fQty(expected[i.id])} ${h(i.unit)} · <span class="d">${diffText(i.id)}</span></div></div>
        <input inputmode="decimal" placeholder="${fQty(expected[i.id])}" value="${h(d.actual[i.id] ?? '')}">
      </div>`).join('');
    applyFilter(); countAll();
  };
  const applyFilter = () => {
    const q = el.querySelector('#q').value.toLowerCase().trim();
    rowsEl.querySelectorAll('.cnt-row').forEach(row => row.style.display = !q || row.dataset.name.includes(q) ? '' : 'none');
  };

  rowsEl.oninput = (e) => {
    const row = e.target.closest('.cnt-row'); if (!row) return;
    const v = e.target.value.trim();
    if (v === '') delete d.actual[row.dataset.id]; else d.actual[row.dataset.id] = v;
    row.querySelector('.d').innerHTML = diffText(row.dataset.id);
    countAll();
  };
  el.querySelector('#q').oninput = applyFilter;
  el.querySelector('#date').onchange = (e) => { d.date = e.target.value; drawRows(); };
  el.querySelector('#fill').onclick = () => {
    items.forEach(i => { if (d.actual[i.id] == null) d.actual[i.id] = String(expected[i.id] || 0); });
    drawRows();
  };

  el.querySelector('#save').onclick = async () => {
    if (!d.date) return notify('Укажите дату');
    const lines = [];
    for (const i of items) {
      if (d.actual[i.id] == null) continue;
      const a = num(d.actual[i.id]);
      if (isNaN(a) || a < 0) return notify(`Неверное количество: ${i.name}`);
      lines.push({ itemId: i.id, expected: expected[i.id] || 0, actual: r3(a) });
    }
    if (!lines.length) return notify('Введите количество хотя бы по одной позиции');
    const later = data.counts.some(c => c.id !== d.id && c.date > d.date);
    if (later && !(await ask('Есть инвентаризация с более поздней датой — эта не изменит текущие остатки. Продолжить?'))) return;
    const doc = { id: d.id, date: d.date, created: d.created, lines };
    const idx = data.counts.findIndex(x => x.id === doc.id);
    if (idx >= 0) data.counts[idx] = doc; else data.counts.push(doc);
    save(); back();
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!(await ask('Удалить инвентаризацию? Остатки будут пересчитаны.'))) return;
    data.counts = data.counts.filter(x => x.id !== d.id);
    save(); back();
  };
  drawRows();
};

  };

function r2(n) { return Math.round(n * 100) / 100; }
function docsInRange(docs, { from, to } = {}) {
  return docs.filter(d => (!from || d.date >= from) && (!to || d.date <= to))
    .sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created);
}

let xlsxLoading = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res;
    s.onerror = () => { xlsxLoading = null; rej(new Error('нет связи с сервером')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

async function downloadXlsx(sheets, fileTitle) {
  toast('Готовлю файл…');
  try { await loadXlsx(); } catch (e) { return notify('Не удалось загрузить модуль Excel: ' + e.message); }
  const wb = XLSX.utils.book_new();
  for (const s of sheets) {
    const rows = s.rows;
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map((_, c) => ({ wch: Math.min(40, Math.max(8, ...rows.map(r => String(r[c] ?? '').length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, s.title.slice(0, 31));
  }
  XLSX.writeFile(wb, `${fileTitle} ${fDate(today())}.xlsx`.replace(/[\\/:*?"<>|«»]/g, ''));
  if (inTelegram && !['tdesktop', 'macos', 'weba', 'webk', 'web'].includes(tg.platform)) {
    setTimeout(() => toast('Если файл не скачался — нажмите «Копировать»'), 1500);
  }
}

function exportXlsx(keys, opts = {}) {
  return downloadXlsx(keys.map(k => ({ title: SHEETS[k].title, rows: SHEETS[k].rows(opts) })),
    `${keys.length === 1 ? SHEETS[keys[0]].title : 'Склад'} ${UNITS[unitKey].title}`);
}

function copyTable(key, opts = {}) { return copyRows(SHEETS[key].rows(opts)); }

async function copyRows(rows) {
  const tsv = rows.map(r => r.map(c =>
    typeof c === 'number' ? String(c).replace('.', ',') : String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');
  try {
    await navigator.clipboard.writeText(tsv);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = tsv; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (!ok) return notify('Не удалось скопировать');
  }
  toast('Скопировано — вставьте в Excel или Google Таблицы');
}

async function ikProducts() {
  if (!IK.products) IK.products = (await api('/api/products')).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  return IK.products;
}
const ikGoods = (list) => list.filter(p => p.type === 'GOODS' && !p.deleted);
const depStores = () => IK.meta.stores.filter(s => s.departmentId === IK.dep.id);
const byKeys = (...ks) => (a, b) => { for (const k of ks) { const c = String(a[k] ?? '').localeCompare(String(b[k] ?? ''), 'ru'); if (c) return c; } return 0; };

async function ikStockRows(storeIds, date) {
  const [products, data] = await Promise.all([ikProducts(), api(`/api/stock?stores=${storeIds.join(',')}&date=${date}`)]);
  const pmap = Object.fromEntries(products.map(p => [p.id, p]));
  const smap = Object.fromEntries(IK.meta.stores.map(s => [s.id, s.name]));
  return data.map(x => {
    const p = pmap[x.productId] || { name: '(неизвестный товар)', unit: '', group: '' };
    const name = p.deleted ? p.name + ' (удалён в iiko)' : p.name;
    const group = p.deleted ? 'Удалённые в iiko' : p.group;
    return { productId: x.productId, store: smap[x.storeId] || '', name, unit: p.unit, group, amount: x.amount, sum: x.sum };
  });
}

async function ikStockSheet(storeIds, date) {
  const rows = (await ikStockRows(storeIds, date)).filter(x => x.amount || x.sum).sort(byKeys('store', 'group', 'name'));
  const out = [['Склад', 'Группа', 'Наименование', 'Ед.', 'Остаток', 'Сумма']];
  let total = 0;
  rows.forEach(x => { total += x.sum; out.push([x.store, x.group, x.name, x.unit, r3(x.amount), r2(x.sum)]); });
  out.push(['', '', 'ИТОГО на ' + fDate(date), '', '', r2(total)]);
  return { title: 'Остатки', rows: out };
}

async function ikItemsSheet() {

}

/* ---------- Документы в iiko (создаются непроведёнными) ---------- */
const DOC_TYPES = {
  invoice:   { title: 'Накладные',      add: '+ Новая накладная',      name: 'Накладная',      icon: '🧾', desc: 'Приход от поставщика' },
  writeoff:  { title: 'Списания',       add: '+ Новое списание',       name: 'Списание',       icon: '📤', desc: 'Расход со склада' },
  inventory: { title: 'Инвентаризация', add: '+ Новая инвентаризация', name: 'Инвентаризация', icon: '📋', desc: 'Пересчёт остатков' },
};
async function ikRefs() { if (!IK.refs) IK.refs = await api('/api/refs'); return IK.refs; }
function lastStore() {
  try { const v = localStorage.getItem('store_' + IK.dep.id); if (depStores().some(s => s.id === v)) return v; } catch (e) { /* нет хранилища */ }
  return (depStores()[0] || {}).id || '';
}
function rememberStore(id) { try { localStorage.setItem('store_' + IK.dep.id, id); } catch (e) { /* нет хранилища */ } }
const storeOptions = (sel) => depStores().map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${h(s.name)}</option>`).join('');

function goodsIndex() {
  if (IK.goodsIdx) return IK.goodsIdx;
  const goods = ikGoods(IK.products);
  const count = {};
  const nm = (p) => p.name.trim().replace(/\s+/g, ' ');   // в iiko у части названий лишние пробелы
  goods.forEach(p => { count[nm(p)] = (count[nm(p)] || 0) + 1; });
  const byLabel = new Map();
  const labelOf = new Map();
  goods.forEach(p => {
    let label = count[nm(p)] > 1 && p.num ? `${nm(p)} · арт. ${p.num}` : nm(p);
    while (byLabel.has(label)) label += ' ·';
    byLabel.set(label, p); labelOf.set(p.id, label);
  });
  return (IK.goodsIdx = { byLabel, labelOf });
}

function sentDone(t, res) {
  notify(`Готово! ${t.name} № ${res.number} создан(а) в iiko без проведения.\nПроверьте документ в iikoOffice и проведите его там.`
    + (res.warning ? '\n\nПредупреждение iiko: ' + res.warning : ''));
}

const KIND_INFO = { invoice: ['🧾', 'Приход'], writeoff: ['📤', 'Списание'], inventory: ['📋', 'Инвентаризация'] };
const storeNames = (ids) => (ids || []).map(id => (IK.meta.stores.find(s => s.id === id) || {}).name || '').filter(Boolean).join(', ');

/* Сервер старой версии не знает /api/journal — тогда показываем только отправленное из приложения */
async function legacyJournal(ids) {
  const rows = await api(`/api/documents?stores=${ids.join(',')}`);
  return rows.map(x => ({ kind: x.type, id: x.type + x.number, number: x.number, date: x.date, status: 'NEW',
    supplier: x.supplier || '', account: x.account || '', stores: [x.storeId], sum: x.total == null ? null : x.total,
    comment: x.comment || '', items: x.items || [], lines: x.lines }));
}

VIEWS.ikJournal = (el, r) => {
  if (!r.period) r.period = 'week';
  if (!r.kind) r.kind = r.type || 'all';
  const KINDS = [['all', 'Все'], ['invoice', '🧾 Приходы'], ['writeoff', '📤 Списания'], ['inventory', '📋 Инвентаризации']];
  const ids = depStores().map(s => s.id);
  el.innerHTML = `
    <h1>${r.type ? DOC_TYPES[r.type].title : 'Журнал документов'}</h1>
    <p class="sub">${h(IK.dep.name)} · по дням, из iiko</p>
    ${r.type ? `<button class="btn wide" id="add" style="margin:0 0 12px">${DOC_TYPES[r.type].add}</button>` : ''}
    <div class="search"><input id="q" type="search" placeholder="Номер, поставщик, статья или товар" value="${h(r.q || '')}"></div>
    ${chipsHtml(PERIODS, r.period, 'period')}
    <div class="grid2" id="custom" style="margin:-4px 0 10px;${r.period === 'custom' ? '' : 'display:none'}">
      <div><label>С</label><input id="from" type="date" value="${h(periodRange(r).from)}"></div>
      <div><label>По</label><input id="to" type="date" value="${h(periodRange(r).to)}"></div>
    </div>
    ${r.type ? '' : chipsHtml(KINDS, r.kind, 'kind')}
    <div id="list"></div>`;
  const list = el.querySelector('#list');
  let docs = [], legacy = false;
  const card = (d, i) => {
    const [icon, title] = KIND_INFO[d.kind] || ['📄', 'Документ'];
    const who = d.supplier || d.account || '';
    const done = d.status === 'PROCESSED';
    return `
      <button class="tile doc" data-i="${i}">
        <span class="icon">${icon}</span>
        <span class="t-main"><div class="t-name">${h(who || title)}</div>
          <div class="t-desc">${who ? title + ' · ' : ''}№ ${h(d.number || '—')}${storeNames(d.stores) ? ' · ' + h(storeNames(d.stores)) : ''}</div></span>
        <span class="t-side">${d.sum ? '<b>' + fMoney(d.sum) + '</b><br>' : ''}<span class="st ${done ? 'done' : 'new'}">${done ? 'Проведён' : 'Не проведён'}</span>${String(d.number).startsWith('TG') ? '<br><span class="st tg">из приложения</span>' : ''}</span>
      </button>`;
  };
  let shown = [];
  const draw = () => {
    const names = Object.fromEntries((IK.products || []).map(p => [p.id, p.name]));
    const q = norm(r.q).trim();
    shown = docs.filter(d => r.kind === 'all' || d.kind === r.kind);
    if (q) shown = shown.filter(d => norm([d.number, d.incomingNumber, d.supplier, d.account, d.comment,
      ...(d.items || []).map(i => names[i.productId])].join(' ')).includes(q));
    list.innerHTML = (legacy ? '<div class="banner">ℹ️ <span>Сейчас видны только документы из приложения. Чтобы видеть все документы iiko, перезапустите сервер (start.cmd).</span></div>' : '')
      + (shown.length ? groupByDate(shown, d => d.date, card, d => d.sum)
        : `<div class="empty">${docs.length ? 'Ничего не найдено — измените поиск или период' : 'За этот период документов нет'}</div>`);
    list.querySelectorAll('[data-i]').forEach(b => b.onclick = () => go('ikDocView', { doc: shown[+b.dataset.i] }));
  };
  const load = async () => {
    list.innerHTML = '<p class="hint">Загрузка из iiko…</p>';
    const { from, to } = periodRange(r);
    try {
      await ikProducts();
      try {
        docs = await api(`/api/journal?from=${from}&to=${to}&stores=${ids.join(',')}`);
        legacy = false;
      } catch (e) {
        if (!/Not Found|Not Allowed|404|405/.test(e.message)) throw e;
        docs = (await legacyJournal(ids)).filter(d => d.date >= from && d.date <= to);
        legacy = true;
      }
      draw();
    } catch (e) {
      list.innerHTML = `<div class="empty" style="white-space:pre-line">${h(e.message)}</div><button class="btn ghost wide" id="retry">Повторить</button>`;
      list.querySelector('#retry').onclick = load;
    }
  };
  el.querySelector('#q').oninput = (e) => { r.q = e.target.value; draw(); };
  el.querySelectorAll('[data-period]').forEach(b => b.onclick = () => {
    r.period = b.dataset.period;
    el.querySelectorAll('[data-period]').forEach(x => x.classList.toggle('on', x === b));
    el.querySelector('#custom').style.display = r.period === 'custom' ? '' : 'none';
    load();
  });
  el.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
    r.kind = b.dataset.kind;
    el.querySelectorAll('[data-kind]').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  ['from', 'to'].forEach(f => el.querySelector('#' + f).onchange = (e) => { r[f] = e.target.value; load(); });
  const add = el.querySelector('#add');
  if (add) add.onclick = () => go('ikDoc', { type: r.type });
  load();
};
VIEWS.ikDocs = VIEWS.ikJournal;

    ${items.length ? items.map(i => {
      const p = P[i.productId] || { name: '(товар не найден)', unit: '' };

VIEWS.ikDoc = (el, r) => r.type === 'inventory' ? ikInventoryView(el, r) : withLoading(el, async () => {
  const t = DOC_TYPES[r.type];
  const isInv = r.type === 'invoice';
  const [refs] = await Promise.all([ikRefs(), ikProducts()]);
  const gi = goodsIndex();
  if (!r.draft) {
    const saved = r.prefill ? null : loadDraft(r.type);
    if (saved && draftSize(r.type, saved)) { r.draft = saved; r.restored = true; }
    else r.draft = r.prefill || { storeId: lastStore(), date: today(), supplier: '', incomingNumber: '', comment: '',
                accountId: (refs.writeoffAccounts[0] || {}).id || '', lines: [{ label: '', qty: '', price: '' }] };
    if (!depStores().some(s => s.id === r.draft.storeId)) r.draft.storeId = lastStore();
    if (!r.draft.lines || !r.draft.lines.length) r.draft.lines = [{ label: '', qty: '', price: '' }];
    if (r.prefill) saveDraft(r.type, r.draft);
  }
  const d = r.draft;
  const persist = () => saveDraft(r.type, d);
  el.innerHTML = `
    ${r.restored ? draftBanner(r.type, d) : ''}
    <h1>${t.name}</h1>
    <p class="sub">${h(IK.dep.name)} · уйдёт в iiko без проведения</p>
    <label>Склад</label>
    <select id="storeId">${storeOptions(d.storeId)}</select>
    <div class="grid2">
      <div><label>Дата</label><input id="date" type="date" value="${h(d.date)}"></div>
      ${isInv
        ? `<div><label>№ у поставщика</label><input id="incomingNumber" value="${h(d.incomingNumber)}" placeholder="Необязательно"></div>`
        : `<div><label>Статья списания</label><select id="accountId">${refs.writeoffAccounts.map(a =>
            `<option value="${a.id}" ${a.id === d.accountId ? 'selected' : ''}>${h(a.name)}</option>`).join('')}</select></div>`}
    </div>
    ${isInv ? `<label>Поставщик</label>
      <input id="supplier" value="${h(d.supplier)}" placeholder="Начните вводить название">` : ''}
    <label>Комментарий</label>
    <input id="comment" value="${h(d.comment)}" placeholder="Необязательно">
    <div class="section-title">Товары</div>
    <div id="lines"></div>
    <button class="btn ghost wide" id="addLine" style="margin-top:4px">+ Добавить строку</button>
    ${isInv ? '<div class="total"><span>Итого</span><span id="total"></span></div>' : ''}
    <button class="btn wide" id="send">Отправить в iiko</button>`;

  let stock = {};
  const linesEl = el.querySelector('#lines');
  const prodOf = (l) => gi.byLabel.get(l.label.trim());
  /* Проверка накладной: цена в разы или заметно выше прошлой закупки, товар обычно приходит на другой склад */
  let hist = null;
  if (isInv) ikPriceData('180').then(dt => {
    hist = { sup: dt.suppliers, by: new Map() };
    dt.points.forEach(([pid, s, date, price, amount, store]) => {
      if (!hist.by.has(pid)) hist.by.set(pid, []);
      hist.by.get(pid).push({ s, date, price, store });
    });
    linesEl.querySelectorAll('.line').forEach(row => { row.querySelector('.l-info').innerHTML = lineInfo(d.lines[row.dataset.i]); });
  }).catch(() => {});
  const lineWarn = (l) => {
    const p = prodOf(l);
    if (!isInv || !hist || !p) return [];
    const list = hist.by.get(p.id) || [];
    if (!list.length) return [];
    const out = [];
    const price = num(l.price);
    if (!isNaN(price) && price > 0) {
      const si = hist.sup.findIndex(n => norm(n).trim() === norm(d.supplier).trim());
      const same = list.filter(x => x.s === si);
      const last = (same.length ? same : list)[(same.length ? same : list).length - 1];
      const k = price / last.price;
      const ref = `${fPrice(last.price)} от ${fDate(last.date).slice(0, 5)}${same.length ? '' : ', ' + hist.sup[last.s]}`;
      if (k > 3 || k < 1 / 3) out.push(`⚠️ цена в ${Math.round(k > 1 ? k : 1 / k)} раз ${k > 1 ? 'выше' : 'ниже'} прошлой (${ref}) — проверьте единицы`);
      else if (k >= 1.25) out.push(`цена выше прошлой на ${Math.round((k - 1) * 100)}% (${ref})`);
    }
    const cnt = {};
    list.forEach(x => { cnt[x.store] = (cnt[x.store] || 0) + 1; });
    if (list.length >= 2 && !cnt[d.storeId]) {
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      const nm = top && (depStores().find(x => x.id === top[0]) || {}).name;
      if (nm) out.push(`обычно приходит на «${nm}»`);
    }
    return out;
  };
  const lineInfo = (l) => {
    const p = prodOf(l);
    if (!p) return l.label.trim() ? '<span class="minus">Выберите товар из подсказок</span>' : '';
    const full = p.name.length > 26 ? `${h(p.name)} · ` : '';
    const warn = lineWarn(l).map(w => `<br><span class="minus">${h(w)}</span>`).join('');
    return full + (isInv ? `ед.: ${h(p.unit)}` : `ед.: ${h(p.unit)} · на складе: ${fQty(stock[p.id])}`) + warn;
  };
  const recalc = () => {
    if (!isInv) return;
    let total = 0;
    linesEl.querySelectorAll('.line').forEach(row => {
      const l = d.lines[row.dataset.i];
      const s = num(l.qty) * num(l.price);
      row.querySelector('.l-sum').textContent = isNaN(s) ? '' : fMoney(s);
      if (!isNaN(s)) total += s;
    });
    el.querySelector('#total').textContent = fMoney(total);
  };
  const drawLines = () => {
    linesEl.innerHTML = d.lines.map((l, i) => `
      <div class="line" data-i="${i}">
        <input class="l-prod" placeholder="Товар — начните вводить" value="${h(l.label)}">
        <div class="line-row ${isInv ? '' : 'wo'}">
          <input class="l-qty" inputmode="decimal" placeholder="Кол-во" value="${h(l.qty)}">
          ${isInv ? `<input class="l-price" inputmode="decimal" placeholder="Цена за ед." value="${h(l.price)}">`
                  : `<span class="cnt-meta l-info">${lineInfo(l)}</span>`}
          <button class="icon-btn l-del" title="Убрать">✕</button>
        </div>
        ${isInv ? `<div class="l-foot"><span class="cnt-meta l-info">${lineInfo(l)}</span><span class="l-sum"></span></div>` : ''}
      </div>`).join('');
    const labels = [...gi.byLabel.keys()];
    linesEl.querySelectorAll('.l-prod').forEach(inp => attachSuggest(inp, () => labels, {
      onPick: () => { const q = inp.closest('.line').querySelector('.l-qty'); if (q) q.focus(); } }));
    recalc();
  };
  const loadStock = async () => {
    if (isInv) return;
    try {
      const rows = await api(`/api/stock?stores=${d.storeId}`);
      stock = {};
      rows.forEach(x => { stock[x.productId] = r3((stock[x.productId] || 0) + x.amount); });
      linesEl.querySelectorAll('.line').forEach(row => { row.querySelector('.l-info').innerHTML = lineInfo(d.lines[row.dataset.i]); });
    } catch (e) { /* подсказка остатка необязательна */ }
  };

  ['date', 'incomingNumber', 'accountId', 'supplier', 'comment'].forEach(f => {
    const inp = el.querySelector('#' + f);
    if (inp) inp.oninput = inp.onchange = (e) => { d[f] = e.target.value; persist(); };
  });
  const refreshInfo = () => linesEl.querySelectorAll('.line').forEach(row => { row.querySelector('.l-info').innerHTML = lineInfo(d.lines[row.dataset.i]); });
  el.querySelector('#storeId').onchange = (e) => { d.storeId = e.target.value; rememberStore(d.storeId); persist(); loadStock(); refreshInfo(); };
  if (isInv) {
    attachSuggest(el.querySelector('#supplier'), () => refs.suppliers.map(s => s.name));
    el.querySelector('#supplier').addEventListener('change', refreshInfo);
  }
  const drop = el.querySelector('#dropDraft');
  if (drop) drop.onclick = async () => {
    if (!(await ask('Удалить черновик и начать документ заново?'))) return;
    clearDraft(r.type); r.draft = null; r.restored = false; r.prefill = null; render();
  };
  linesEl.oninput = (e) => {
    const row = e.target.closest('.line'); if (!row) return;
    const l = d.lines[row.dataset.i];
    if (e.target.classList.contains('l-prod')) {
      l.label = e.target.value;
      const p = prodOf(l);
      if (p && isInv && !l.price && p.price) { l.price = String(p.price); row.querySelector('.l-price').value = l.price; }
      row.querySelector('.l-info').innerHTML = lineInfo(l);
    }
    if (e.target.classList.contains('l-qty')) l.qty = e.target.value;
    if (e.target.classList.contains('l-price')) { l.price = e.target.value; row.querySelector('.l-info').innerHTML = lineInfo(l); }
    recalc();
    persist();
  };
  linesEl.onclick = (e) => {
    if (!e.target.classList.contains('l-del')) return;
    d.lines.splice(+e.target.closest('.line').dataset.i, 1);
    if (!d.lines.length) d.lines.push({ label: '', qty: '', price: '' });
    drawLines();
    persist();
  };
  el.querySelector('#addLine').onclick = () => {
    d.lines.push({ label: '', qty: '', price: '' });
    drawLines();
    persist();
    const inputs = linesEl.querySelectorAll('.l-prod');
    inputs[inputs.length - 1].focus();
  };

  el.querySelector('#send').onclick = async (ev) => {
    if (!d.date) return notify('Укажите дату');
    const items = [];
    for (const l of d.lines) {
      if (!l.label.trim() && !l.qty) continue;
      const p = prodOf(l);
      if (!p) return notify(`Товар «${l.label}» не найден. Выберите его из подсказок.`);
      const qty = num(l.qty);
      if (isNaN(qty) || qty <= 0) return notify(`Неверное количество: ${p.name}`);
      const item = { productId: p.id, amount: r3(qty) };
      if (isInv) {
        if (!String(l.price).trim()) return notify(`Укажите цену: ${p.name}`);
        const pr = num(l.price);
        if (isNaN(pr) || pr < 0) return notify(`Неверная цена: ${p.name}`);
        item.price = pr;
      }
      items.push(item);
    }
    if (!items.length) return notify('Добавьте хотя бы один товар');
    const body = { storeId: d.storeId, date: d.date, comment: d.comment, items };
    if (isInv) {
      const s = refs.suppliers.find(x => x.name === d.supplier.trim());
      if (!s) return notify('Выберите поставщика из подсказок');
      body.supplierId = s.id;
      body.incomingNumber = d.incomingNumber;
    } else {
      body.accountId = d.accountId;
    }
    const storeName = (depStores().find(s => s.id === d.storeId) || {}).name || '';
    const warns = isInv ? d.lines.flatMap(l => lineWarn(l).map(w => `• ${prodOf(l).name.trim()}: ${w}`)) : [];
    if (warns.length && !(await ask(`Проверьте накладную:\n${warns.slice(0, 8).join('\n')}${warns.length > 8 ? `\n…и ещё ${warns.length - 8}` : ''}\n\nВсё верно, продолжить?`))) return;
    if (!(await ask(`Отправить в iiko: ${t.name.toLowerCase()}, ${storeName}, позиций: ${items.length}?\nДокумент будет создан без проведения.`))) return;
    const btn = ev.target;
    btn.disabled = true; btn.textContent = 'Отправляю…';
    try {
      const res = await api('/api/documents/' + r.type, body);
      r.draft = null;
      clearDraft(r.type);
      sentDone(t, res);
      back();
    } catch (e) {
      notify(e.message);
      btn.disabled = false; btn.textContent = 'Отправить в iiko';
    }
  };

  drawLines();
  loadStock();
});

/* Калькулятор: «(12+3)*8», «2,5+1», «12х0,5», «10:4». Возвращает число или NaN. */
function calc(src) {
  const s = String(src == null ? '' : src).replace(/\s+/g, '').replace(/,/g, '.')
    .replace(/[×xхXХ*]/g, '*').replace(/[÷:/]/g, '/').replace(/[−–—]/g, '-');
  if (!s) return NaN;
  let i = 0;
  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const t = term(); v = o === '+' ? v + t : v - t; } return v; };
  const term = () => { let v = factor(); while (s[i] === '*' || s[i] === '/') { const o = s[i++]; const f = factor(); v = o === '*' ? v * f : v / f; } return v; };
  const factor = () => {
    if (s[i] === '-') { i++; return -factor(); }
    if (s[i] === '+') { i++; return factor(); }
    if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw new Error('('); i++; return v; }
    const m = /^\d+\.(?!\d)|^\d*\.?\d+/.exec(s.slice(i));
    if (!m) throw new Error('num');
    i += m[0].length;
    return parseFloat(m[0]);
  };
  try { const v = expr(); return i === s.length && isFinite(v) ? r3(v) : NaN; } catch (e) { return NaN; }
}
/* Распознавание фото выключено: нужен ключ Claude API на сервере. Включить — поставить true. */
const PHOTO_ENABLED = false;
const isPlainNum =(s) => /^\s*\d+([.,]\d+)?\s*$/.test(String(s));

/* Подсказки под полем ввода. Вместо <datalist>: в Telegram он рисуется поверх текста с артефактами. */
function attachSuggest(input, source, { onPick, mount } = {}) {
  if (!input || input._sugg) return;
  input.removeAttribute('list');
  input.setAttribute('autocomplete', 'off');
  const box = document.createElement('div');
  box.className = 'sugg';
  box.hidden = true;
  (mount || input).after(box);
  input._sugg = box;
  const find = () => {
    const q = norm(input.value).trim();
    if (!q) return [];
    const words = q.split(/\s+/);
    const out = [];
    for (const v of source()) {
      const n = norm(v);
      if (!words.every(w => n.includes(w))) continue;
      const wordStart = (' ' + n.replace(/[^a-zа-я0-9]+/g, ' ')).includes(' ' + words[0]);
      out.push([n.startsWith(q) ? 0 : wordStart ? 1 : n.includes(q) ? 2 : 3, v]);
    }
    return out.sort((a, b) => a[0] - b[0] || a[1].length - b[1].length).slice(0, 8).map(x => x[1]);
  };
  const draw = () => {
    const list = find(), cur = input.value.trim();
    if (document.activeElement !== input || !list.length || (list.length === 1 && list[0] === cur)) { box.hidden = true; return; }
    box.innerHTML = list.map(v => `<button type="button" data-v="${h(v)}">${h(v)}</button>`).join('');
    box.hidden = false;
  };
  input.addEventListener('input', draw);
  input.addEventListener('focus', draw);
  input.addEventListener('blur', () => setTimeout(() => { box.hidden = true; }, 120));
  box.addEventListener('pointerdown', (e) => e.preventDefault());   // не терять фокус поля при нажатии
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    e.stopPropagation();
    haptic();
    input.value = b.dataset.v;
    box.hidden = true;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
    if (onPick) onPick(b.dataset.v); else input.blur();
  });
}

/* Всплывающее окно снизу. Кнопка «Назад» Telegram сначала закрывает его. */
let sheetStack = [];
function openSheet(html, { locked = false } = {}) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">${locked ? '' : '<button class="sheet-x" aria-label="Закрыть">✕</button>'}${html}</div>`;
  document.body.appendChild(bg);
  requestAnimationFrame(() => bg.classList.add('show'));
  const api_ = { el: bg.querySelector('.sheet'), close: () => { sheetStack = sheetStack.filter(x => x !== api_); bg.remove(); }, locked };
  if (!locked) {
    bg.onclick = (e) => { if (e.target === bg) api_.close(); };
    bg.querySelector('.sheet-x').onclick = api_.close;
  }
  sheetStack.push(api_);
  return api_;
}
function closeTopSheet() {
  const s = sheetStack[sheetStack.length - 1];
  if (!s) return false;
  if (!s.locked) s.close();
  return true;
}

/* Позиции для инвентаризации: товары и заготовки */
const invProducts = () => IK.products.filter(p => !p.deleted && (p.type === 'GOODS' || p.type === 'PREPARED'));
const INV_TABS = { GOODS: 'Товары', PREPARED: 'Заготовки' };
function invIndex() {
  if (IK.invIdx) return IK.invIdx;
  const list = invProducts();
  const cnt = {};
  const nm = (p) => p.name.trim().replace(/\s+/g, ' ');
  list.forEach(p => { cnt[nm(p)] = (cnt[nm(p)] || 0) + 1; });
  const byLabel = new Map(), labelOf = new Map(), byId = new Map(), byNum = new Map(), byName = new Map();
  list.forEach(p => {
    let label = nm(p);
    if (cnt[nm(p)] > 1) label += p.num ? ` · арт. ${p.num}` : (p.type === 'PREPARED' ? ' · заготовка' : ' · товар');
    while (byLabel.has(label)) label += ' ·';
    byLabel.set(label, p); labelOf.set(p.id, label); byId.set(p.id, p);
    if (p.num) byNum.set(norm(p.num).trim(), p);
    const k = norm(p.name).trim();
    byName.set(k, byName.has(k) ? null : p); // null — название не уникально
  });
  return (IK.invIdx = { list, byLabel, labelOf, byId, byNum, byName, toks: list.map(p => [p, tokens(p.name)]) });
}
const tokens = (s) => norm(s).replace(/[^a-zа-я0-9]+/g, ' ').split(' ').filter(t => t.length > 1);
function tokScore(a, b) {
  if (!a.length || !b.length) return 0;
  let m = 0;
  a.forEach(x => { if (b.some(y => x === y || (Math.min(x.length, y.length) >= 3 && (x.startsWith(y) || y.startsWith(x))))) m++; });
  return 2 * m / (a.length + b.length);
}
/* Сопоставление строки из фото/Excel с позицией iiko: ok — уверенно, warn — проверить, none — не найдено */
function matchLine(line) {
  const ix = invIndex();
  if (line.productId && ix.byId.has(line.productId)) return { p: ix.byId.get(line.productId), st: line.sure === false ? 'warn' : 'ok' };
  if (line.art) { const p = ix.byNum.get(norm(line.art).trim()); if (p) return { p, st: 'ok' }; }
  const exact = ix.byName.get(norm(line.text).trim());
  if (exact) return { p: exact, st: 'ok' };
  const t = tokens(line.text);
  let best = null, bs = 0;
  ix.toks.forEach(([p, pt]) => { const s = tokScore(t, pt); if (s > bs) { bs = s; best = p; } });
  if (best && bs >= 0.45) return { p: best, st: bs >= 0.85 ? 'ok' : 'warn' };
  return { p: null, st: 'none' };
}
