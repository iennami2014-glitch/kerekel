/* ---------- Чтение Excel ---------- */
async function readInvExcel(file) {
  await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const out = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    if (!rows.length) continue;
    const find = (row, re) => row.findIndex(c => re.test(String(c).trim()));
    let head = -1, cName = -1, cQty = -1, cArt = -1, cId = -1;
    for (let i = 0; i < Math.min(rows.length, 20) && head < 0; i++) {
      const n = find(rows[i], /наимен|товар|назван|продукт|позици|номенклат/i);
      if (n < 0) continue;
      let q = find(rows[i], /факт/i);
      if (q < 0) q = find(rows[i], /^кол|количеств|посчитан/i);
      if (q < 0) continue;
      head = i; cName = n; cQty = q; cArt = find(rows[i], /артикул|^код|^арт/i); cId = find(rows[i], /^id$/i);
    }
    if (head < 0) { // без заголовка: текстовая колонка — название, числовая — количество
      const sample = rows.slice(0, 40), w = Math.max(...sample.map(r => r.length));
      const score = (c, f) => sample.filter(r => f(r[c])).length;
      let bestT = -1, bestN = -1;
      for (let c = 0; c < w; c++) {
        if (bestT < 0 || score(c, v => typeof v === 'string' && /[a-zа-я]{3}/i.test(v)) > score(bestT, v => typeof v === 'string' && /[a-zа-я]{3}/i.test(v))) bestT = c;
      }
      for (let c = 0; c < w; c++) {
        if (c !== bestT && (bestN < 0 || score(c, v => typeof v === 'number') >= score(bestN, v => typeof v === 'number'))) bestN = c;
      }
      if (bestT < 0 || bestN < 0) continue;
      cName = bestT; cQty = bestN;
    }
    rows.slice(head + 1).forEach(r => {
      const text = String(r[cName] ?? '').trim();
      const q = r[cQty];
      if (!text || q === '' || q == null || /^итог/i.test(text)) return;
      out.push({ text, qty: typeof q === 'number' ? String(r3(q)).replace('.', ',') : String(q).trim(),
        art: cArt >= 0 ? String(r[cArt] ?? '').trim() : '', productId: cId >= 0 ? String(r[cId] ?? '').trim() : '' });
    });
    if (out.length) break;
  }
  return out;
}

/* ---------- Фото → сервер (распознавание) ---------- */
async function shrinkImage(file, max = 2000) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Не удалось открыть фото ' + file.name)); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function recognizePhotos(files) {
  const sh = openSheet(`<h2>Распознаю фото</h2><div class="spin"></div><p class="hint" id="ph" style="text-align:center">Подготовка…</p>
    <p class="hint" style="text-align:center">Обычно это занимает до минуты на фото. Не закрывайте приложение.</p>`, { locked: true });
  const ph = sh.el.querySelector('#ph');
  const lines = [], notes = [];
  try {
    for (let k = 0; k < files.length; k++) {
      ph.textContent = `Фото ${k + 1} из ${files.length}: отправляю…`;
      const image = await shrinkImage(files[k]);
      let job;
      try { job = (await api('/api/inventory/recognize', { image, mediaType: 'image/jpeg' })).job; } catch (e) {
        if (/Not Found|Not Allowed|404|405/.test(e.message)) throw new Error('Сервер ещё старой версии. Перезапустите start.cmd и попробуйте снова.');
        throw e;
      }
      ph.textContent = `Фото ${k + 1} из ${files.length}: читаю записи…`;
      let st = null;
      for (let t = 0; t < 200; t++) {
        await new Promise(r => setTimeout(r, 2500));
        st = await api('/api/inventory/recognize/' + job);
        if (st.status !== 'work') break;
      }
      if (!st || st.status === 'work') throw new Error('Распознавание идёт слишком долго. Попробуйте фото поменьше или по частям.');
      if (st.status === 'error') throw new Error(st.error);
      st.result.lines.forEach(l => lines.push({ ...l, qty: l.qty == null ? '' : String(l.qty).replace('.', ','), src: files.length > 1 ? `фото ${k + 1}` : '' }));
      if (st.result.note) notes.push((files.length > 1 ? `Фото ${k + 1}: ` : '') + st.result.note);
    }
  } finally { sh.close(); }
  return { lines, note: notes.join('\n') };
}

/* ---------- Калькулятор количества ---------- */
function openCalc(p, ctx) {
  const unit = p.unit || '';
  const sh = openSheet(`
    <div class="calc-name">${h(p.name)}</div>
    <div class="hint">${p.type === 'PREPARED' ? 'Заготовка' : 'Товар'}${unit ? ' · в ' + h(unit) : ''} · по учёту: ${fQty(ctx.expected(p.id))} ${h(unit)}</div>
    <input class="calc-expr" id="ex" inputmode="none" autocomplete="off" placeholder="0" value="${h(ctx.get(p.id) || '')}">
    <div class="calc-res" id="res"></div>
    <div class="keys">
      ${['C', '(', ')', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', ',', '0', '⌫', '=']
        .map(k => `<button data-k="${k}" class="${/[0-9,]/.test(k) ? '' : 'op'}">${k}</button>`).join('')}
    </div>
    <div class="calc-act">
      <button class="btn ghost" id="clr" title="Убрать количество">🗑</button>
      <button class="btn ghost" id="ok">Сохранить</button>
      <button class="btn" id="next">${ctx.hasNext(p.id) ? 'Дальше ›' : 'Готово'}</button>
    </div>
    <p class="hint" style="margin:10px 0 0">Можно считать частями: «12+3+5». Если товар лежит в нескольких местах — допишите «+» и количество.</p>`);
  const ex = sh.el.querySelector('#ex'), res = sh.el.querySelector('#res');
  const upd = () => {
    const v = ex.value.trim(), n = calc(v);
    res.className = 'calc-res' + (v && !isNaN(n) ? ' ok' : '');
    res.textContent = !v ? 'Введите количество' : isNaN(n) ? '…' : (isPlainNum(v) ? '' : '= ') + fQty(n) + ' ' + unit;
  };
  const put = (s) => { ex.value += s; upd(); };
  sh.el.querySelector('.keys').onclick = (e) => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    haptic();
    if (k === 'C') ex.value = '';
    else if (k === '⌫') ex.value = ex.value.slice(0, -1);
    else if (k === '=') { const n = calc(ex.value); if (!isNaN(n)) ex.value = String(n).replace('.', ','); }
    else put({ '÷': '/', '×': '*', '−': '-' }[k] || k);
    upd();
  };
  ex.oninput = upd;
  const save = () => {
    const v = ex.value.trim();
    if (!v) { ctx.set(p.id, null); return true; }
    const n = calc(v);
    if (isNaN(n)) { toast('Проверьте запись: ' + v); return false; }
    if (n < 0) { toast('Количество не может быть меньше нуля'); return false; }
    ctx.set(p.id, v);
    return true;
  };
  ex.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); sh.el.querySelector('#next').click(); } };
  sh.el.querySelector('#clr').onclick = () => { ex.value = ''; save(); sh.close(); };
  sh.el.querySelector('#ok').onclick = () => { if (save()) sh.close(); };
  sh.el.querySelector('#next').onclick = () => {
    if (!save()) return;
    sh.close();
    const nx = ctx.next(p.id);
    if (nx) openCalc(nx, ctx);
  };
  upd();
  if (!matchMedia('(pointer: coarse)').matches) ex.focus();
}

      <p class="sub">${h(IK.dep.name)} · уйдёт в iiko без проведения</p>
      <div id="dateWarn"></div>
      <div class="grid2">
        <div><label>Склад</label><select id="storeId">${storeOptions(d.storeId)}</select></div>
        <div><label>Дата инвентаризации</label><input id="date" type="date" value="${h(d.date)}"></div>
      </div>
      <div class="inv-tools">
        ${PHOTO_ENABLED ? '<button class="btn ghost sm" id="addPhoto">📷 Фото</button>' : ''}
        <button class="btn ghost sm" id="addXls">📊 Excel</button>
        <button class="btn ghost sm" id="blank">⬇️ Бланк</button>
      </div>
      <input type="file" id="fPhoto" accept="image/*" multiple hidden>
      <input type="file" id="fXls" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
      <div class="seg">${Object.entries(INV_TABS).map(([k, l]) => `<button data-tab="${k}">${l} <small></small></button>`).join('')}</div>
      <div class="search"><input id="q" type="search" placeholder="Найти позицию" value="${h(r.q || '')}"></div>
      <div id="flt"></div>
      <div id="rows"></div>
      <button class="btn ghost wide" id="fill" style="margin-top:8px">Заполнить пустые по учёту</button>
      <label>Комментарий</label>
      <input id="comment" value="${h(d.comment)}" placeholder="Необязательно">
      <button class="btn danger wide" id="delInv" style="margin-top:12px">🗑 Удалить инвентаризацию</button>
      <div class="inv-bar"><span>Посчитано<br><b id="cnt">0</b></span><button class="btn" id="send">Отправить в iiko</button></div>`;
    const showDate = () => {
      el.querySelector('#hDate').textContent = 'на ' + fDate(d.date);
      el.querySelector('#dateWarn').innerHTML = d.date !== today()
        ? `<div class="banner">🗓 <span>Инвентаризация на <b>${fDate(d.date)}</b>, а сегодня ${fDate(today())}. Если считаете сегодня — поменяйте дату ниже.</span></div>` : '';
    };
    showDate();
    const rowsEl = el.querySelector('#rows');
    const val = (id) => calc(d.actual[id]);
    const diffText = (id) => {
      const a = val(id);
      if (isNaN(a)) return '';
      const diff = r3(a - (expected[id] || 0));
      if (!diff) return ' · <span class="plus">совпадает</span>';
      return ` · <span class="${diff > 0 ? 'plus' : 'minus'}">${diff > 0 ? '+' : ''}${fQty(diff)}</span>`;
    };
    const rowHtml = (p) => {
      const v = d.actual[p.id], has = v != null && v !== '';
      return `<button class="inv-row ${has ? 'done' : ''}" data-id="${p.id}">
        <span class="t-main"><div>${h(p.name)}</div>
          <div class="cnt-meta">по учёту: ${fQty(expected[p.id])} ${h(p.unit)}${has ? diffText(p.id) : ''}</div></span>
        <span class="inv-val ${has ? '' : 'empty'}">${has ? fQty(val(p.id)) + ' ' + h(p.unit) + (isPlainNum(v) ? '' : `<small>${h(v)}</small>`) : 'ввести'}</span>
      </button>`;
    };
    const updateCount = () => {
      el.querySelector('#cnt').textContent = Object.keys(d.actual).length;
      el.querySelectorAll('.seg button').forEach(b => {
        const tab = b.dataset.tab, list = all.filter(p => p.type === tab && inScope(p));
        b.classList.toggle('on', tab === r.tab);
        b.querySelector('small').textContent = `${list.filter(p => d.actual[p.id] != null).length}/${list.length}`;
      });
    };
    const drawRows = () => {
      el.querySelector('#flt').innerHTML = chipsHtml(INV_FILTERS, r.filter, 'f');
      el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { r.filter = b.dataset.f; drawRows(); });
      const q = norm(r.q).trim();
      const list = all.filter(p => p.type === r.tab
        && (!q || norm(p.name + ' ' + p.group + ' ' + p.num).includes(q))
        && (r.filter === 'all' || (r.filter === 'store' && inStore(p)) || (r.filter === 'stock' && withRows.has(p.id))
          || (r.filter === 'done' && d.actual[p.id] != null) || (r.filter === 'todo' && inStore(p) && d.actual[p.id] == null)))
        .sort(byKeys('group', 'name'));
      const flat = !grouped();
      const groups = new Map();
      list.forEach(p => { const g = p.group || 'Без группы'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); });
      let html = '', shown = 0;
      visible = [];
      groups.forEach((items, g) => {
        const done = items.filter(p => d.actual[p.id] != null).length;
        const open = flat || r.open.has(g);
        html += `<button class="grp ${open ? 'open' : ''} ${done === items.length ? 'full' : ''}" data-g="${h(g)}">
          <span>📁</span><span class="t-main">${h(g)}</span><span class="cnt">${done}/${items.length}</span><span class="arrow">›</span></button>`;
        if (open) {
          const part = items.slice(0, Math.max(0, 400 - shown));
          shown += part.length; visible.push(...part);
          html += `<div class="grp-body">${part.map(rowHtml).join('')}</div>`;
        }
      });
      rowsEl.innerHTML = html + (shown >= 400 ? '<p class="hint">Показаны первые 400 позиций. Уточните поиск.</p>' : '')
        + (list.length ? '' : `<div class="empty">${q ? 'Ничего не найдено' : 'Здесь пока пусто'}`
          + (r.filter !== 'all' ? '<br><button class="btn ghost sm" id="toAll" style="margin-top:10px">Искать во всех позициях</button>' : '') + '</div>')
        + (r.filter === 'store' && storeSet && list.length ? '<p class="hint">Показаны позиции, которые были на этом складе за последние полгода. Нет нужной — нажмите «Все позиции».</p>' : '');
      const toAll = rowsEl.querySelector('#toAll');
      if (toAll) toAll.onclick = () => { r.filter = 'all'; drawRows(); };
      updateCount();
    };
    const ctx = {
      expected: (id) => expected[id] || 0,
      get: (id) => d.actual[id],
      set: (id, v) => {
        if (v == null) delete d.actual[id]; else d.actual[id] = v;
        persist();
        const row = rowsEl.querySelector(`.inv-row[data-id="${id}"]`);
        if (row && grouped()) { row.outerHTML = rowHtml(ix.byId.get(id)); refreshGroupCounts(); updateCount(); }
        else drawRows();
      },
      hasNext: (id) => visible.findIndex(p => p.id === id) < visible.length - 1,
      next: (id) => { const i = visible.findIndex(p => p.id === id); return i >= 0 ? visible[i + 1] : null; },
    };
    const refreshGroupCounts = () => rowsEl.querySelectorAll('.grp').forEach(b => {
      const items = all.filter(p => p.type === r.tab && inScope(p) && (p.group || 'Без группы') === b.dataset.g);
      const done = items.filter(p => d.actual[p.id] != null).length;
      b.querySelector('.cnt').textContent = `${done}/${items.length}`;
      b.classList.toggle('full', done === items.length);
    });
    rowsEl.onclick = (e) => {
      const g = e.target.closest('.grp');
      if (g) {
        if (!grouped()) return;
        r.open.has(g.dataset.g) ? r.open.delete(g.dataset.g) : r.open.add(g.dataset.g);
        drawRows(); return;
      }
      const row = e.target.closest('.inv-row');
      if (row) openCalc(ix.byId.get(row.dataset.id), ctx);
    };
    el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { r.tab = b.dataset.tab; drawRows(); });
    el.querySelector('#q').oninput = (e) => { r.q = e.target.value; drawRows(); };
    el.querySelector('#comment').oninput = (e) => { d.comment = e.target.value; persist(); };
    const loadExpected = async () => {
      rowsEl.innerHTML = '<p class="hint">Загрузка остатков из iiko…</p>';
      try {
        const [rows, si] = await Promise.all([
          api(`/api/stock?stores=${d.storeId}&date=${d.date}`),
          api(`/api/store-items?store=${d.storeId}`).catch(() => null), // старый сервер — без фильтра по складу
        ]);
        storeSet = si && si.ids && si.ids.length ? new Set(si.ids) : null;
        expected = {}; withRows = new Set();
        rows.forEach(x => { expected[x.productId] = r3((expected[x.productId] || 0) + x.amount); withRows.add(x.productId); });
      } catch (e) { toast('Остатки не загрузились: ' + e.message); }
      drawRows();
    };
    el.querySelector('#storeId').onchange = async (e) => {
      if (Object.keys(d.actual).length && !(await ask('Смена склада очистит введённые количества. Продолжить?'))) { e.target.value = d.storeId; return; }
      d.storeId = e.target.value; d.actual = {}; rememberStore(d.storeId); persist(); loadExpected();
    };
    el.querySelector('#date').onchange = (e) => { d.date = e.target.value || today(); persist(); showDate(); loadExpected(); };
    el.querySelector('#delInv').onclick = async () => {
      const n = Object.keys(d.actual).length;
      if (!(await ask(`Удалить эту инвентаризацию${n ? ` (посчитано ${n} поз.)` : ''}? Введённые количества пропадут.\nВ iiko ничего не отправлялось — удаляется только черновик в приложении.`))) return;
      clearDraft('inventory'); r.draft = null;
      toast('Инвентаризация удалена');
      back();
    };
    el.querySelector('#fill').onclick = async () => {
      const ids = [...withRows].filter(id => d.actual[id] == null && ix.byId.has(id));
      if (!ids.length) return toast('Пустых позиций с остатком нет');
      if (!(await ask(`Заполнить ${ids.length} непосчитанных позиций количеством «по учёту»?`))) return;
      ids.forEach(id => { d.actual[id] = String(Math.max(0, expected[id] || 0)).replace('.', ','); });
      persist(); drawRows();
    };
    /* Импорт: фото и Excel */
    const importLines = (lines, source, note) => {
      if (!lines.length) return notify(`${source}: не нашлось ни одной строки с количеством.${note ? '\n' + note : ''}`);
      go('ikInvReview', { lines, source, note, target: d });
    };
    const runPhoto = async (files) => {
      try { const res = await recognizePhotos(files); importLines(res.lines, 'Фото', res.note); } catch (e) { notify(e.message); }
    };
    const runExcel = async (file) => {
      toast('Читаю файл…');
      try { importLines(await readInvExcel(file), 'Excel'); } catch (e) { notify('Не удалось прочитать файл: ' + e.message); }
    };
    const fPhoto = el.querySelector('#fPhoto'), fXls = el.querySelector('#fXls');
    if (PHOTO_ENABLED) el.querySelector('#addPhoto').onclick = () => fPhoto.click();
    el.querySelector('#addXls').onclick = () => fXls.click();
    fPhoto.onchange = () => { const f = [...fPhoto.files]; fPhoto.value = ''; if (f.length) runPhoto(f); };
    fXls.onchange = () => { const f = fXls.files[0]; fXls.value = ''; if (f) runExcel(f); };
    el.querySelector('#blank').onclick = () => {
      const store = (depStores().find(s => s.id === d.storeId) || {}).name || '';
      const rows = [['Тип', 'Группа', 'Наименование', 'Артикул', 'Ед.', 'По учёту', 'Факт', 'ID']];
      all.filter(inStore).sort(byKeys('type', 'group', 'name')).forEach(p => rows.push([
        p.type === 'PREPARED' ? 'Заготовка' : 'Товар', p.group, p.name, p.num, p.unit, r3(expected[p.id] || 0), '', p.id]));
      downloadXlsx([{ title: 'Инвентаризация', rows }], `Бланк инвентаризации ${store}`);
    };
    const drop = el.querySelector('#dropDraft');
    if (drop) drop.onclick = async () => {
      if (!(await ask('Удалить черновик и начать инвентаризацию заново?'))) return;
      clearDraft('inventory'); r.draft = null; r.restored = false; render();
    };
    el.querySelector('#send').onclick = async (ev) => {
      if (!d.date) return notify('Укажите дату');
      const items = [];
      for (const [id, v] of Object.entries(d.actual)) {
        const a = calc(v);
        const p = ix.byId.get(id);
        if (!p) continue;
        if (isNaN(a) || a < 0) return notify(`Неверное количество: ${p.name} — «${v}»`);
        items.push({ productId: id, amount: r3(a) });
      }
      if (!items.length) return notify('Введите количество хотя бы по одной позиции');
      const storeName = (depStores().find(s => s.id === d.storeId) || {}).name || '';
      if (!(await ask(`Отправить инвентаризацию в iiko: ${storeName}, на ${fDate(d.date)}, позиций: ${items.length}?\nДокумент будет создан без проведения.`))) return;
      const btn = ev.target;
      btn.disabled = true; btn.textContent = 'Отправляю…';
      try {
        const res = await api('/api/documents/inventory', { storeId: d.storeId, date: d.date, comment: d.comment, items });
        r.draft = null;
        clearDraft('inventory');
        sentDone(t, res);
        back();
      } catch (e) {
        notify(e.message);
        btn.disabled = false; btn.textContent = 'Отправить в iiko';
      }
    };
    persist();
    await loadExpected();
    if (r.pending) {
      const pd = r.pending; r.pending = null;
      if (pd.kind === 'photo') runPhoto(pd.files); else if (pd.kind === 'excel') runExcel(pd.file);
    }
  });
}

/* ---------- Проверка результата импорта (фото / Excel) ---------- */
VIEWS.ikInvReview = (el, r) => {
  const ix = invIndex();
  if (!r.rows) {
    r.rows = r.lines.map(l => {
      const m = matchLine(l);
      return { text: l.text, src: l.src || '', qty: l.qty, label: m.p ? ix.labelOf.get(m.p.id) : '', st: m.st, on: m.st !== 'none' };
    });
    r.mode = 'replace';
  }
  const cnt = (st) => r.rows.filter(x => x.st === st).length;
  el.innerHTML = `
    <h1>Проверьте результат</h1>
    <p class="sub">${h(r.source)} · ${r.rows.length} ${plural(r.rows.length, 'строка', 'строки', 'строк')}:
      ✅ ${cnt('ok')} · ⚠️ проверить ${cnt('warn')} · ❌ не найдено ${cnt('none')}</p>
    ${r.note ? `<div class="banner">ℹ️ <span>${h(r.note)}</span></div>` : ''}
    <p class="hint">Жёлтые — проверьте, правильно ли подобран товар. Красные — выберите товар сами или снимите галочку. Количество можно исправить.</p>
    <label>Если позиция уже посчитана</label>
    ${chipsHtml([['replace', 'Заменить'], ['add', 'Прибавить']], r.mode, 'mode')}
    <div id="rv">${r.rows.map((x, i) => `
      <div class="rv ${x.st} ${x.on ? '' : 'off'}" data-i="${i}">
        <div class="rv-src"><span>«${h(x.text)}»</span><span>${h(x.src)}</span></div>
        <div class="rv-row">
          <input class="l-prod" placeholder="Выберите товар" value="${h(x.label)}">
          <input class="l-qty" inputmode="decimal" value="${h(x.qty)}" placeholder="кол-во">
          <input type="checkbox" class="l-on" ${x.on ? 'checked' : ''} title="Добавить">
        </div>
      </div>`).join('')}</div>
    <button class="btn wide" id="apply"></button>
    <button class="btn ghost wide" id="cancel" style="margin-top:8px">Отмена</button>`;
  const ixLabels = [...ix.byLabel.keys()];
  el.querySelectorAll('.rv .l-prod').forEach(inp => attachSuggest(inp, () => ixLabels, { mount: inp.closest('.rv-row') }));
  const btn = el.querySelector('#apply');
  const upd = () => { const n = r.rows.filter(x => x.on).length; btn.textContent = `Добавить в инвентаризацию (${n})`; btn.disabled = !n; };
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    r.mode = b.dataset.mode;
    el.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  });
  el.querySelector('#rv').oninput = el.querySelector('#rv').onchange = (e) => {
    const card = e.target.closest('.rv'); if (!card) return;
    const x = r.rows[+card.dataset.i];
    if (e.target.classList.contains('l-prod')) {
      x.label = e.target.value;
      const ok = ix.byLabel.has(x.label);
      x.st = ok ? 'ok' : 'none';
      if (ok && e.type === 'change') x.on = true;
      card.className = `rv ${x.st} ${x.on ? '' : 'off'}`;
      card.querySelector('.l-on').checked = x.on;
    } else if (e.target.classList.contains('l-qty')) x.qty = e.target.value;
    else if (e.target.classList.contains('l-on')) { x.on = e.target.checked; card.classList.toggle('off', !x.on); }
    upd();
  };
  el.querySelector('#cancel').onclick = back;
  btn.onclick = () => {
    const acc = new Map();
    for (const x of r.rows.filter(x => x.on)) {
      const p = ix.byLabel.get(x.label);
      if (!p) return notify(`Выберите товар для строки «${x.text}» или снимите галочку`);
      const n = calc(x.qty);
      if (isNaN(n) || n < 0) return notify(`Проверьте количество: «${x.text}» — «${x.qty}»`);
      const q = String(x.qty).trim();
      acc.set(p.id, acc.has(p.id) ? acc.get(p.id) + '+' + q : q);
    }
    const d = r.target;
    d.actual = d.actual || {};
    let added = 0, merged = 0;
    acc.forEach((q, id) => {
      if (d.actual[id] != null && r.mode === 'add') { d.actual[id] = d.actual[id] + '+' + q; merged++; }
      else { d.actual[id] = q; added++; }
    });
    saveDraft('inventory', d);
    back();
    toast(`Добавлено позиций: ${added + merged}`);
  };
  upd();
};

VIEWS.ikItems = (el, r) => withLoading(el, async () => {
  const [products, stock] = await Promise.all([ikProducts(), api('/api/stock?stores=' + depStores().map(s => s.id).join(','))]);
  const goods = ikGoods(products);
  const qty = {};
  stock.forEach(s => { qty[s.productId] = r3((qty[s.productId] || 0) + s.amount); });
  el.innerHTML = `
    <h1>Номенклатура</h1>
    <p class="sub">${h(IK.dep.name)} · из iiko · ${goods.length} товаров</p>
    <div class="search"><input id="q" type="search" placeholder="Название, группа или артикул" value="${h(r.q || '')}"></div>
    <div id="list"></div>`;
  const list = el.querySelector('#list');
  const LIMIT = 150;
  const draw = () => {
    const q = norm(r.q).trim();
    const items = goods.filter(p => !q || norm(p.name + ' ' + p.group + ' ' + p.num).includes(q));
    list.innerHTML = items.slice(0, LIMIT).map(p => `
      <div class="tile static">
        <span class="t-main"><div class="t-name">${h(p.name)}</div>
          <div class="t-desc">${h(p.group || 'Без группы')}${p.num ? ' · арт. ' + h(p.num) : ''}${p.price ? ' · ≈' + fMoney(p.price) : ''}</div></span>
        <span class="t-side ${(qty[p.id] || 0) < 0 ? 'minus' : ''}"><b>${fQty(qty[p.id])}</b> ${h(p.unit)}</span>
      </div>`).join('')
      + (items.length > LIMIT ? `<p class="hint">Показано ${LIMIT} из ${items.length}. Уточните поиск.</p>` : '')
      + (items.length ? '' : '<div class="empty">Ничего не найдено</div>');
  };
  el.querySelector('#q').oninput = (e) => { r.q = e.target.value; draw(); };
  draw();
});

VIEWS.ikStock = (el, r) => {
  if (!r.date) r.date = today();
  if (r.nz == null) r.nz = true;
  if (r.store == null) r.store = '';
  const stores = depStores();
  el.innerHTML = `
    <h1>Остатки</h1>
    <p class="sub">${h(IK.dep.name)} · из iiko</p>
    <label>Склад</label>
    <select id="store"><option value="">Все склады заведения</option>
      ${stores.map(s => `<option value="${s.id}" ${s.id === r.store ? 'selected' : ''}>${h(s.name)}</option>`).join('')}</select>
    <div class="grid2">
      <div><label>На дату</label><input id="date" type="date" value="${h(r.date)}"></div>
      <div><label>Поиск</label><input id="q" type="search" placeholder="Товар или группа" value="${h(r.q || '')}"></div>
    </div>
    <label class="chk"><input type="checkbox" id="nz" ${r.nz ? 'checked' : ''}> Скрыть нулевые остатки</label>
    <div id="list"></div>
    <div class="total"><span>Итого</span><span id="sum"></span></div>
    <button class="btn ghost wide" id="xls">📥 Выгрузить в Excel</button>`;
  const list = el.querySelector('#list');
  const ids = () => r.store ? [r.store] : stores.map(s => s.id);
  let rows = [];
  const draw = () => {
    const q = (r.q || '').toLowerCase().trim();
    const agg = {};
    rows.forEach(x => {
      const a = agg[x.productId] || (agg[x.productId] = { name: x.name, unit: x.unit, group: x.group, amount: 0, sum: 0 });
      a.amount = r3(a.amount + x.amount); a.sum += x.sum;
    });
    const items = Object.values(agg)
      .filter(a => !r.nz || a.amount !== 0)
      .filter(a => !q || a.name.toLowerCase().includes(q) || a.group.toLowerCase().includes(q))
      .sort(byKeys('group', 'name'));
    let total = 0, html = '', cat = null, catSum = 0, catHtml = '';
    const flush = () => { if (cat !== null) html += `<div class="cat-head"><span>${h(cat || 'Без группы')}</span><span>${fMoney(catSum)}</span></div>` + catHtml; };
    for (const a of items) {
      if (a.group !== cat) { flush(); cat = a.group; catSum = 0; catHtml = ''; }
      total += a.sum; catSum += a.sum;
      catHtml += `<div class="rep-row">
        <span class="t-main"><div>${h(a.name)}</div></span>
        <span class="t-side ${a.amount < 0 ? 'minus' : ''}"><b>${fQty(a.amount)}</b> ${h(a.unit)}<div class="cnt-meta">${fMoney(a.sum)}</div></span>
      </div>`;
    }
    flush();
    list.innerHTML = html || '<div class="empty">Нет остатков для отображения</div>';
    el.querySelector('#sum').textContent = fMoney(total);
  };
  const load = async () => {
    list.innerHTML = '<p class="hint">Загрузка из iiko…</p>';
    el.querySelector('#sum').textContent = '';
    try { rows = await ikStockRows(ids(), r.date); draw(); }
    catch (e) { list.innerHTML = `<div class="empty">${h(e.message)}</div>`; }
  };
  el.querySelector('#store').onchange = (e) => { r.store = e.target.value; load(); };
  el.querySelector('#date').onchange = (e) => { r.date = e.target.value || today(); load(); };
  el.querySelector('#q').oninput = (e) => { r.q = e.target.value; draw(); };
  el.querySelector('#nz').onchange = (e) => { r.nz = e.target.checked; draw(); };
  el.querySelector('#xls').onclick = async () => {
    try { await downloadXlsx([await ikStockSheet(ids(), r.date)], 'Остатки ' + IK.dep.name); }
    catch (e) { notify(e.message); }
  };
  load();
};

/* ---------- Техкарты: блюда, заготовки, модификаторы ---------- */
const TTK_TABS = { DISH: 'Блюда', PREPARED: 'Заготовки', MODIFIER: 'Модификаторы' };
/* Фудкост: себестоимость / средняя цена продажи по меню за 30 дней в этом заведении */
const fcLimit = () => { const v = +lsGet('fcLimit'); return v >= 10 && v <= 80 ? v : 35; };
async function ikFoodcost() {
  IK.fc = IK.fc || {};
  if (!IK.fc[IK.dep.id]) IK.fc[IK.dep.id] = await api('/api/foodcost?dept=' + IK.dep.id).then(x => x.items || {}).catch(() => ({}));
  return IK.fc[IK.dep.id];
}
const fcClass = (fc) => fc > 100 ? 'minus' : fc > fcLimit() ? 'minus' : 'plus';
const fcText = (fc) => fc > 100 ? '⚠️ ' + Math.round(fc) + '%' : Math.round(fc) + '%';
const TTK_KIND = { DISH: 'Блюдо', PREPARED: 'Заготовка', MODIFIER: 'Модификатор', GOODS: 'Товар', SERVICE: 'Услуга' };
const fAmt = (n) => (n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 4 });
const fRub = (n) => n == null ? '—' : (n >= 100 ? Math.round(n).toLocaleString('ru-RU') : n.toLocaleString('ru-RU', { maximumFractionDigits: 2 })) + ' ₽';
const amtVal = (s) => isPlainNum(s) ? num(s) : calc(s);
/* Суммарный выход в граммах: строки в кг и л (1 мл ≈ 1 г) по их выходу; шт, порц, уп не входят */
function yieldG(items, out) {
  let g = 0;
  const skip = [];
  items.forEach(i => {
    let o = i.amountOut;
    if (i.amt != null) {
      const v = amtVal(i.amt), k = i.amountIn ? i.amountOut / i.amountIn : 1;
      o = isNaN(v) ? 0 : v * k;
    }
    if (i.unit === 'кг' || i.unit === 'л') g += o * 1000;
    else skip.push(`${i.name.trim()} ${fAmt(o)} ${i.unit}`);
  });
  const n = num(out) || 1;
  return { g, per: g / n, n, skip };
}
const fG = (g) => Math.round(g).toLocaleString('ru-RU') + ' г';
const yieldHtml = (y, unit) => `Выход в граммах <b>${fG(y.g)}</b>${y.n !== 1 ? ` <small>(на 1 ${h(unit)} — ${fG(y.per)})</small>` : ''}`
  + (y.skip.length ? `<small class="ttk-skip">без учёта: ${h(y.skip.join(', '))}</small>` : '');

VIEWS.ikTtk = (el, r) => withLoading(el, async () => {
  const [products, tc, fcs] = await Promise.all([ikProducts(), api('/api/techcards').catch(e => {
    throw /Not Found|404/.test(e.message) ? new Error('Сервер ещё старой версии. Перезапустите start.cmd и откройте раздел снова.') : e;
  }), ikFoodcost()]);
  const charts = tc.charts || {};
  r.tab = r.tab || 'DISH';
  r.mode = r.mode || 'all';
  r.open = r.open || new Set();
  const all = products.filter(p => !p.deleted && TTK_TABS[p.type]);
  el.innerHTML = `
    <h1>Техкарты</h1>
    <p class="sub">Из iiko · себестоимость примерная, по текущим ценам</p>
    <div class="seg s3">${Object.entries(TTK_TABS).map(([k, l]) => `<button data-tab="${k}">${l}<br><small>${all.filter(p => p.type === k).length}</small></button>`).join('')}</div>

    <div class="search"><input id="q" type="search" placeholder="Найти по названию" value="${h(r.q || '')}"></div>
    <div id="rows"></div>`;
  const rowsEl = el.querySelector('#rows');
  const drawModes = () => {
    const n = Object.values(fcs).filter(x => x.fc > fcLimit() && !x.staff && pmById.get(x.id) && pmById.get(x.id).type === r.tab).length;
    el.querySelector('#modes').innerHTML = r.tab === 'PREPARED' ? '' : chipsHtml([['all', 'Все'], ['fc', `Фудкост выше ${fcLimit()}% · ${n}`], ['fcall', 'Фудкост всех продаваемых']], r.mode, 'mode')
      + (r.mode !== 'all' && r.tab !== 'PREPARED' ? `<label class="chk">Норма фудкоста <select id="lim" style="width:auto;margin-left:8px">${[25, 28, 30, 32, 35, 38, 40, 45].map(v => `<option ${v === fcLimit() ? 'selected' : ''}>${v}</option>`).join('')}</select>&nbsp;%</label>` : '');
    el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { r.mode = b.dataset.mode; draw(); });
    const lim = el.querySelector('#lim');
    if (lim) lim.onchange = () => { lsSet('fcLimit', lim.value); draw(); };
  };
  const pmById = new Map(all.map(p => [p.id, p]));
  const fcHtml = (p) => {
    const f = fcs[p.id];
    return f ? `<span class="fc ${fcClass(f.fc)}">фк ${fcText(f.fc)}</span>` : '';
  };
  const rowHtml = (p) => {
    const c = charts[p.id], f = fcs[p.id];
    if (r.mode !== 'all' && f) {
      return `<button class="inv-row" data-id="${p.id}">
        <span class="t-main"><div>${h(p.name)}</div>
          <div class="cnt-meta">себест. ≈ ${fRub(f.cost)} · цена ${fRub(f.price)} · продано ${fQty(f.sold)} за 30 дн.</div></span>
        <span class="inv-val ${fcClass(f.fc)}">${fcText(f.fc)}</span></button>`;
    }
    return `<button class="inv-row ${c ? '' : 'no-ttk'}" data-id="${p.id}">
      <span class="t-main"><div>${h(p.name)}</div>
        <div class="cnt-meta">${norm(r.q).trim() ? h(p.group || 'без группы') + ' · ' : ''}${c ? `${c.n} ингр. · с ${fDate(c.dateFrom)}` : 'нет техкарты'}</div></span>
      <span class="inv-val">${c && c.cost != null ? '≈ ' + fRub(c.cost) : ''}<small>${c && c.cost != null ? 'за 1 ' + h(p.unit) : ''}</small>${fcHtml(p)}</span>
    </button>`;
  };
  const draw = () => {
    el.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === r.tab));
    if (r.tab === 'PREPARED') r.mode = 'all';
    drawModes();
    const q = norm(r.q).trim();
    let list = all.filter(p => p.type === r.tab && (!q || norm(p.name + ' ' + p.group).includes(q))).sort(byKeys('group', 'name'));
    if (r.mode !== 'all') {
      list = list.filter(p => fcs[p.id] && (r.mode === 'fcall' || (fcs[p.id].fc > fcLimit() && !fcs[p.id].staff)))
        .sort((a, b) => fcs[b.id].fc - fcs[a.id].fc);
      rowsEl.innerHTML = (r.mode === 'fc' ? `<p class="hint">Себестоимость по техкарте делим на среднюю цену продажи по меню за 30 дней в «${h(IK.dep.name)}». Больше 100% — почти наверняка ошибка в техкарте (единицы, количество).</p>` : '')
        + (list.map(rowHtml).join('') || '<div class="empty">Таких блюд нет 👍</div>');
      return;
    }
    if (q) {
      rowsEl.innerHTML = list.slice(0, 200).map(rowHtml).join('') || '<div class="empty">Ничего не найдено</div>';
      return;
    }
    const groups = new Map();
    list.forEach(p => { const g = p.group || 'Без группы'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); });
    let html = '';
    groups.forEach((items, g) => {
      const open = r.open.has(g), without = items.filter(p => !charts[p.id]).length;
      html += `<button class="grp ${open ? 'open' : ''}" data-g="${h(g)}"><span>📁</span><span class="t-main">${h(g)}</span>
        <span class="cnt">${items.length}${without ? ` · без ТТК ${without}` : ''}</span><span class="arrow">›</span></button>`;
      if (open) html += `<div class="grp-body">${items.map(rowHtml).join('')}</div>`;
    });
    rowsEl.innerHTML = html || '<div class="empty">Здесь пусто</div>';
  };
  rowsEl.onclick = (e) => {
    const g = e.target.closest('.grp');
    if (g) { r.open.has(g.dataset.g) ? r.open.delete(g.dataset.g) : r.open.add(g.dataset.g); draw(); return; }
    const row = e.target.closest('.inv-row');
    if (row) go('ikTtkCard', { id: row.dataset.id });
  };
  el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { r.tab = b.dataset.tab; draw(); });
  el.querySelector('#q').oninput = (e) => { r.q = e.target.value; draw(); };
  draw();
});

/* Выбор ингредиента: товары, заготовки, блюда */
function pickIngredient(title, onPick) {
  const list = IK.products.filter(p => !p.deleted && ['GOODS', 'PREPARED', 'DISH', 'MODIFIER'].includes(p.type));
  const sh = openSheet(`<h2>${h(title)}</h2>
    <div class="search"><input id="pq" type="search" placeholder="Начните вводить название" autocomplete="off"></div>
    <div id="pl" class="pick-list"></div>`);
  const pl = sh.el.querySelector('#pl'), pq = sh.el.querySelector('#pq');
  const draw = () => {
    const q = norm(pq.value).trim();
    if (!q) { pl.innerHTML = '<p class="hint">Например: «сметана», «пф борщ», «лук»</p>'; return; }
    const t = tokens(q);
    const found = list.map(p => {
      const n = norm(p.name);
      const s = n.startsWith(q) ? 3 : n.includes(q) ? 2 : tokScore(t, tokens(p.name));
      return [s, p];
    }).filter(([s]) => s >= 0.6).sort((a, b) => b[0] - a[0] || (a[1].type === 'GOODS' ? -1 : 1) || a[1].name.localeCompare(b[1].name, 'ru')).slice(0, 60);
    pl.innerHTML = found.map(([, p]) => `<button class="inv-row" data-id="${p.id}"><span class="t-main"><div>${h(p.name)}</div>
      <div class="cnt-meta">${TTK_KIND[p.type] || ''} · ${h(p.group || 'без группы')}</div></span><span class="inv-val">${h(p.unit)}</span></button>`).join('')
      || '<div class="empty">Ничего не найдено</div>';
  };
  pq.oninput = draw;
  pl.onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) { sh.close(); onPick(IK.products.find(p => p.id === b.dataset.id)); } };
  draw();
  if (!matchMedia('(pointer: coarse)').matches) pq.focus(); else setTimeout(() => pq.focus(), 250);
}

VIEWS.ikTtkCard = (el, r) => withLoading(el, async () => {
  await ikProducts();
  if (!r.data) r.data = await api('/api/techcard?product=' + encodeURIComponent(r.id));
  const fcInfo = (await ikFoodcost())[r.id] || null;
  const fcOf = (per) => fcInfo && fcInfo.price ? per / fcInfo.price * 100 : null;
  const d = r.data, p = d.product, ch = d.chart;
  const versions = [ch, ...(d.future || [])].filter(Boolean);
  const chartFor = (day) => versions.filter(v => v.dateFrom <= day).pop() || null;
  const cost = (items, out) => {
    let s = 0, miss = 0;
    items.forEach(i => { const a = i.amt != null ? amtVal(i.amt) : i.amountIn; if (i.price == null) miss++; else if (!isNaN(a)) s += a * i.price; });
    return { per: s / (num(out) || 1), miss };
  };
  const usedHtml = () => d.usedIn.length ? `<div class="section-title">Используется в (${d.usedIn.length})</div>`
    + d.usedIn.map(u => `<button class="inv-row" data-open="${u.id}"><span class="t-main"><div>${h(u.name)}</div>
      <div class="cnt-meta">${TTK_KIND[u.type] || ''}</div></span><span class="inv-val">${fAmt(u.amountIn)} ${h(p.unit)}</span></button>`).join('') : '';
  const bindOpen = () => el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('ikTtkCard', { id: b.dataset.open }));

  if (!r.ed) {   // ---------- просмотр ----------
    const c = ch ? cost(ch.items, ch.assembledAmount) : null;
    el.innerHTML = `
      <h1>${h(p.name)}</h1>
      <p class="sub">${TTK_KIND[p.type] || ''} · ${h(p.group || 'без группы')}</p>
      ${(d.future || []).map(f => `<div class="banner">🗓 <span>С ${fDate(f.dateFrom)} уже запланирована новая версия техкарты (${f.items.length} ингр.)</span></div>`).join('')}
      ${ch ? `
        <div class="ttk-head"><span>Выход <b>${fAmt(ch.assembledAmount)} ${h(p.unit)}</b></span><span>Действует с <b>${fDate(ch.dateFrom)}</b></span>
          <span>Себестоимость <b>≈ ${fRub(c.per)}</b>${c.miss ? ' <small>(не у всех есть цена)</small>' : ''}</span>
          ${fcInfo ? `<span>Цена продажи <b>${fRub(fcInfo.price)}</b> · фудкост <b class="${fcClass(fcOf(c.per))}">${fcText(fcOf(c.per))}</b>
            <small>(продано ${fQty(fcInfo.sold)} за 30 дн.)</small></span>` : ''}
          <span class="ttk-yield">${yieldHtml(yieldG(ch.items, ch.assembledAmount), p.unit)}</span></div>
        <div class="section-title">Состав · брутто</div>
        ${ch.items.map(i => `<button class="inv-row" ${['PREPARED', 'DISH', 'MODIFIER'].includes(i.type) ? `data-open="${i.id}"` : ''}>
          <span class="t-main"><div>${h(i.name)}${['PREPARED', 'DISH', 'MODIFIER'].includes(i.type) ? ' <span class="hint">›</span>' : ''}</div>
            <div class="cnt-meta">${TTK_KIND[i.type] || ''}${i.amountMiddle !== i.amountIn || i.amountOut !== i.amountIn ? ` · нетто ${fAmt(i.amountMiddle)} · выход ${fAmt(i.amountOut)}` : ''}${i.price != null ? ' · ≈ ' + fRub(i.price * i.amountIn) : ''}</div></span>
          <span class="inv-val">${fAmt(i.amountIn)} ${h(i.unit)}</span></button>`).join('') || '<div class="empty">Ингредиентов нет</div>'}
        ${ch.technologyDescription ? `<div class="section-title">Технология</div><div class="ttk-tech">${h(ch.technologyDescription)}</div>` : ''}`
      : '<div class="empty">У этой позиции нет техкарты</div>'}
      ${usedHtml()}
      <div class="inv-bar"><button class="btn" id="edit">${ch ? '✏️ Изменить техкарту' : '➕ Создать техкарту'}</button></div>`;
    bindOpen();
    el.querySelector('#edit').onclick = () => {
      const base = chartFor(d.minDate);
      r.ed = { date: d.minDate, out: String(base ? base.assembledAmount : 1).replace('.', ','), tech: base ? base.technologyDescription : '',
        items: (base ? base.items : []).map(i => ({ ...i, amt: String(i.amountIn).replace('.', ',') })) };
      render();
    };
    return;
  }

  // ---------- изменение ----------
  const e_ = r.ed;
  el.innerHTML = `
    <h1>${h(p.name)}</h1>
    <p class="sub">Изменение техкарты · в iiko уйдёт только после подтверждения</p>
    <div class="grid2">
      <div><label>Действует с</label><input id="date" type="date" min="${d.minDate}" value="${h(e_.date)}"></div>
      <div><label>Выход, ${h(p.unit)}</label><input id="out" inputmode="decimal" value="${h(e_.out)}"></div>
    </div>
    <div class="ttk-head"><span class="ttk-yield" id="yg"></span></div>
    <div class="section-title">Состав · брутто</div>
    <div id="items"></div>
    <button class="btn ghost wide" id="add">➕ Добавить ингредиент</button>
    <label>Технология приготовления</label>
    <textarea id="tech" rows="3" placeholder="Необязательно">${h(e_.tech)}</textarea>
    <p class="hint">Количество можно писать выражением: «0,12+0,03». Нетто и выход строк пересчитаются в той же пропорции, что были.
      Старая версия техкарты сохранится в iiko до выбранной даты, а копия — на компьютере.</p>
    <div class="inv-bar"><span>Себест.<br><b id="cost">—</b></span><button class="btn ghost" id="cancel">Отмена</button><button class="btn" id="check">Проверить</button></div>`;
  const itemsEl = el.querySelector('#items');
  const drawCost = () => {
    const c = cost(e_.items, e_.out);
    el.querySelector('#cost').textContent = '≈ ' + fRub(c.per);
    el.querySelector('#yg').innerHTML = yieldHtml(yieldG(e_.items, e_.out), p.unit)
      + (fcInfo ? `<br>Фудкост станет <b class="${fcClass(fcOf(c.per))}">${fcText(fcOf(c.per))}</b> <small>(цена продажи ${fRub(fcInfo.price)})</small>` : '');
  };
  const metaHtml = (i) => {
    const v = amtVal(i.amt), bad = isNaN(v) || v <= 0;
    return `${TTK_KIND[i.type] || ''}${i.replaced ? ' · вместо «' + h(i.replaced) + '»' : ''}${i.replaced && i.oldUnit && i.oldUnit !== i.unit ? ` · <span class="minus">⚠️ было в ${h(i.oldUnit)}, проверьте количество</span>` : ''}${i.price != null && !bad ? ' · ≈ ' + fRub(i.price * v) : ''}${!isPlainNum(i.amt) && !bad ? ' · = ' + fAmt(v) : ''}`;
  };
  const drawItems = () => {
    itemsEl.innerHTML = e_.items.map((i, k) => {
      const v = amtVal(i.amt), bad = isNaN(v) || v <= 0;
      return `<div class="ttk-ed ${bad ? 'bad' : ''}" data-k="${k}">
        <div class="t-main"><div>${h(i.name)}</div><div class="cnt-meta">${metaHtml(i)}</div></div>
        <input class="amt" inputmode="decimal" value="${h(i.amt)}" data-k="${k}"><span class="u">${h(i.unit)}</span>
        <button class="ic" data-rep="${k}" title="Заменить">🔁</button><button class="ic" data-del="${k}" title="Убрать">✕</button>
      </div>`;
    }).join('') || '<div class="empty">Добавьте ингредиенты</div>';
    drawCost();
  };
  itemsEl.oninput = (ev) => {
    const k = ev.target.dataset.k; if (k == null) return;
    e_.items[k].amt = ev.target.value;
    const v = amtVal(ev.target.value), row = ev.target.closest('.ttk-ed');
    row.classList.toggle('bad', isNaN(v) || v <= 0);
    row.querySelector('.cnt-meta').innerHTML = metaHtml(e_.items[k]);
    drawCost();
  };
  itemsEl.onclick = (ev) => {
    const rep = ev.target.dataset.rep, del = ev.target.dataset.del;
    if (del != null) { e_.items.splice(+del, 1); drawItems(); }
    if (rep != null) pickIngredient('Заменить «' + e_.items[rep].name + '» на…', (np) => {
      if (np.id === p.id) return notify('Нельзя добавить позицию саму в себя');
      const old = e_.items[rep];
      e_.items[rep] = { ...old, id: np.id, name: np.name, unit: np.unit, type: np.type, price: null,
        replaced: old.replaced || old.name, oldUnit: old.oldUnit || old.unit };
      drawItems(); fetchPrice(e_.items[rep]);
    });
  };
  const fetchPrice = async (it) => {   // цена нового ингредиента — из его карточки
    try {
      const x = await api('/api/techcard?product=' + encodeURIComponent(it.id));
      it.price = x.cost;
    } catch (e) { /* без цены */ }
    const k = e_.items.indexOf(it), row = itemsEl.querySelector(`.ttk-ed[data-k="${k}"]`);
    if (row) row.querySelector('.cnt-meta').innerHTML = metaHtml(it);
    drawCost();
  };
  el.querySelector('#add').onclick = () => pickIngredient('Добавить ингредиент', (np) => {
    if (np.id === p.id) return notify('Нельзя добавить позицию саму в себя');
    if (e_.items.some(i => i.id === np.id)) return notify('«' + np.name + '» уже есть в составе — измените количество в его строке');
    const it = { id: np.id, name: np.name, unit: np.unit, type: np.type, amt: '', price: null, itemId: null };
    e_.items.push(it); drawItems(); fetchPrice(it);
    setTimeout(() => { const inp = itemsEl.querySelector(`input[data-k="${e_.items.length - 1}"]`); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } }, 300);
  });
  el.querySelector('#date').onchange = (ev) => { e_.date = ev.target.value; };
  el.querySelector('#out').oninput = (ev) => { e_.out = ev.target.value; drawCost(); };
  el.querySelector('#tech').oninput = (ev) => { e_.tech = ev.target.value; };
  el.querySelector('#cancel').onclick = async () => { if (await ask('Отменить изменения?')) { r.ed = null; render(); } };
  el.querySelector('#check').onclick = () => {
    if (!e_.date || e_.date < d.minDate) return notify('Дата начала — не раньше ' + fDate(d.minDate));
    const out = amtVal(e_.out);
    if (isNaN(out) || out <= 0) return notify('Проверьте выход');
    if (!e_.items.length) return notify('В техкарте нет ни одного ингредиента');
    const bad = e_.items.find(i => { const v = amtVal(i.amt); return isNaN(v) || v <= 0; });
    if (bad) return notify('Проверьте количество: ' + bad.name);
    const ids = e_.items.map(i => i.id);
    if (new Set(ids).size !== ids.length) return notify('Один и тот же ингредиент указан дважды — объедините строки');
    const base = chartFor(e_.date);
    const was = new Map((base ? base.items : []).map(i => [i.id, i]));
    const now = new Map(e_.items.map(i => [i.id, i]));
    const lines = [];
    e_.items.forEach(i => {
      const v = amtVal(i.amt), o = was.get(i.id);
      if (i.replaced && !o) lines.push(`🔁 ${h(i.replaced)} → <b>${h(i.name)}</b> ${fAmt(v)} ${h(i.unit)}`);
      else if (!o) lines.push(`➕ <b>${h(i.name)}</b> ${fAmt(v)} ${h(i.unit)}`);
      else if (Math.abs(o.amountIn - v) > 1e-9) lines.push(`✏️ ${h(i.name)}: ${fAmt(o.amountIn)} → <b>${fAmt(v)}</b> ${h(i.unit)}`);
    });
    (base ? base.items : []).forEach(o => { if (!now.has(o.id) && !e_.items.some(i => i.replaced === o.name && !was.has(i.id))) lines.push(`➖ ${h(o.name)} ${fAmt(o.amountIn)} ${h(o.unit)}`); });
    if (base && Math.abs(base.assembledAmount - out) > 1e-9) lines.push(`Выход: ${fAmt(base.assembledAmount)} → <b>${fAmt(out)}</b> ${h(p.unit)}`);
    if (base && (base.technologyDescription || '') !== e_.tech) lines.push('Технология приготовления изменена');
    if (base && !lines.length) return notify('Изменений нет');
    const c0 = base ? cost(base.items, base.assembledAmount).per : null, c1 = cost(e_.items, e_.out).per;
    const sh = openSheet(`<h2>Было → станет</h2>
      <p class="sub">${h(p.name)} · с ${fDate(e_.date)}${base && base.dateFrom === e_.date ? ' (заменит версию от этой же даты)' : ''}</p>
      <div class="ttk-diff">${base ? lines.map(l => `<div>${l}</div>`).join('') : '<div>Новая техкарта: ' + e_.items.length + ' ингр.</div>'}</div>
      <p>Себестоимость: ${c0 != null ? fRub(c0) + ' → ' : ''}<b>${fRub(c1)}</b><br>
        Выход в граммах: ${base ? fG(yieldG(base.items, base.assembledAmount).g) + ' → ' : ''}<b>${fG(yieldG(e_.items, e_.out).g)}</b>
        ${fcInfo ? `<br>Фудкост: ${c0 != null ? fcText(fcOf(c0)) + ' → ' : ''}<b>${fcText(fcOf(c1))}</b>` : ''}</p>
      <p class="hint">Перед записью сервер сохранит резервную копию техкарты. Документы до ${fDate(e_.date)} не изменятся.</p>
      <div class="grid2"><button class="btn ghost" id="no">Назад</button><button class="btn" id="yes">Сохранить в iiko</button></div>`);
    sh.el.querySelector('#no').onclick = sh.close;
    sh.el.querySelector('#yes').onclick = async (ev) => {
      ev.target.disabled = true; ev.target.textContent = 'Сохраняю…';
      try {
        const res = await api('/api/techcard/save', {
          productId: p.id, baseChartId: base ? base.id : null, dateFrom: e_.date, assembledAmount: out, technologyDescription: e_.tech,
          items: e_.items.map(i => ({ itemId: i.itemId || null, productId: i.id, amountIn: amtVal(i.amt) })) });
        sh.close();
        notify(`Техкарта «${p.name}» сохранена в iiko с ${fDate(res.dateFrom)}.` + (res.verified ? '' : '\n\n⚠️ Проверка чтением не подтвердила изменения — посмотрите техкарту в iikoOffice.'));
        r.ed = null; r.data = null; render();
      } catch (e) {
        ev.target.disabled = false; ev.target.textContent = 'Сохранить в iiko';
        notify(e.message);
      }
    };
  };
  drawItems();
});

/* ---------- Динамика закупочных цен (по приходным накладным) ---------- */
const PRICE_PERIODS = [['30', 'Месяц'], ['90', '3 мес'], ['180', 'Полгода'], ['365', 'Год']];
const PRICE_FILTERS = [['up', 'Дороже'], ['down', 'Дешевле'], ['check', 'Проверить'], ['all', 'Все']];
const SUP_COLORS = ['#2481cc', '#e8833a', '#2e9e4f', '#9b51e0', '#d64545', '#1aa3a3', '#b8860b', '#666'];
const fPrice = (n) => n == null ? '—' : n.toLocaleString('ru-RU', { maximumFractionDigits: n >= 100 ? 0 : 2 }) + ' ₽';
const fPct = (x) => (x > 0 ? '+' : '') + Math.round(x) + '%';
const odd = (a, b) => a > 0 && b > 0 && (a / b > 3 || b / a > 3);   // скачок в разы — похоже на ошибку в единицах накладной

async function ikPriceData(days) {
  IK.prices = IK.prices || {};
  const key = IK.dep.id + ':' + days;
  if (!IK.prices[key]) {
    IK.prices[key] = await api(`/api/prices?days=${days}&stores=${depStores().map(s => s.id).join(',')}`).catch(e => {
      throw /Not Found|404/.test(e.message) ? new Error('Сервер ещё старой версии. Перезапустите start.cmd и откройте раздел снова.') : e;
    });
  }
  return IK.prices[key];
}

/* По каждому товару: последняя закупка и предыдущая у того же поставщика */
function priceSummary(data) {
  const by = new Map();
  data.points.forEach(([pid, s, date, price, amount, store, num]) => {
    if (!by.has(pid)) by.set(pid, []);
    by.get(pid).push({ s, date, price, amount, store, num });
  });
  const out = [];
  by.forEach((list, pid) => {
    const last = list[list.length - 1];
    const same = list.filter(x => x.s === last.s);
    const prev = same.length > 1 ? same[same.length - 2] : null;
    const prices = list.map(x => x.price);
    out.push({ pid, list, last, prev, change: prev && prev.price ? (last.price - prev.price) / prev.price * 100 : null,
      min: Math.min(...prices), max: Math.max(...prices), sups: new Set(list.map(x => x.s)).size });
  });
  return out;
}

function priceChart(list, suppliers) {
  if (list.length < 2) return '';
  const W = 320, H = 150, P = 6;
  const t0 = Date.parse(list[0].date), t1 = Date.parse(list[list.length - 1].date) || t0 + 1;
  const vals = list.map(x => x.price), lo = Math.min(...vals), hi = Math.max(...vals);
  const x = (d) => P + (t1 > t0 ? (Date.parse(d) - t0) / (t1 - t0) : 0.5) * (W - 2 * P);
  const y = (v) => H - P - (hi > lo ? (v - lo) / (hi - lo) : 0.5) * (H - 2 * P);
  const sids = [...new Set(list.map(p => p.s))];
  const lines = sids.map((s, k) => {
    const pts = list.filter(p => p.s === s);
    const c = SUP_COLORS[k % SUP_COLORS.length];
    return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p => `${x(p.date).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ')}"/>`
      + pts.map(p => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.price).toFixed(1)}" r="3" fill="${c}"/>`).join('');
  }).join('');
  return `<div class="pchart"><div class="pchart-y"><span>мин. <b>${fPrice(lo)}</b></span><span>макс. <b>${fPrice(hi)}</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines}</svg>
    <div class="pchart-x"><span>${fDate(list[0].date)}</span><span>${fDate(list[list.length - 1].date)}</span></div>
    ${sids.length > 1 ? `<div class="pchart-leg">${sids.map((s, k) => `<span><i style="background:${SUP_COLORS[k % SUP_COLORS.length]}"></i>${h(suppliers[s])}</span>`).join('')}</div>` : ''}</div>`;
}

VIEWS.ikPrice = (el, r) => withLoading(el, async () => {
  const [products, data] = await Promise.all([ikProducts(), ikPriceData(r.days || '90')]);

  const list = data.points.filter(x => x[0] === r.id).map(([, s, date, price, amount, store, num]) => ({ s, date, price, amount, store, num }));
  const unit = p.unit ? '/' + h(p.unit) : '';
  const sids = [...new Set(list.map(x => x.s))];
  const bySup = sids.map(s => {
    const l = list.filter(x => x.s === s), pr = l.map(x => x.price);
    return { s, last: l[l.length - 1], min: Math.min(...pr), max: Math.max(...pr), n: l.length };
  }).sort((a, b) => a.last.price - b.last.price);
  const prevOf = new Map();
  const lastBy = {};
  list.forEach((x, i) => { if (lastBy[x.s] != null) prevOf.set(i, list[lastBy[x.s]]); lastBy[x.s] = i; });

  el.innerHTML = `

      const pv = prevOf.get(i), ch = pv && pv.price ? (x.price - pv.price) / pv.price * 100 : null;
      return `<div class="rep-row"><span class="t-main"><div>${fDate(x.date)} · ${h(data.suppliers[x.s])}</div>
        <div class="cnt-meta">${fQty(x.amount)} ${h(p.unit)} · № ${h(x.num)}${storeName(x.store) ? ' · ' + h(storeName(x.store)) : ''}${pv && odd(x.price, pv.price) ? ' · <span class="minus">⚠️ цена в разы отличается — проверьте единицы в накладной</span>' : ''}</div></span>
        <span class="t-side"><b>${fPrice(x.price)}</b>${ch != null && Math.abs(ch) >= 1 ? `<div class="cnt-meta ${ch > 0 ? 'minus' : 'plus'}">${fPct(ch)}</div>` : ''}</span></div>`;
    }).join('') || '<div class="empty">Закупок нет</div>'}`;
});

const ico = (n) => `<i class="ico" style="--ic:url(${ICON_BASE}${n}.svg)" aria-hidden="true"></i>`;
const NAV = [
  { view: 'ikHome', icon: 'layout-dashboard', title: 'Главная', tab: true },
  { view: 'ikJournal', icon: 'file-invoice', title: 'Документы', tab: true },
  { view: 'ikStock', icon: 'box', title: 'Остатки', tab: true },
  { act: 'inv', icon: 'clipboard-list', title: 'Инвентаризация' },
  { view: 'ikTtk', icon: 'book', title: 'Техкарты', tab: true },

  { view: 'ikItems', icon: 'package', title: 'Номенклатура' },
  { view: 'ikExport', icon: 'download', title: 'Выгрузка' },
];
const SECTION_OF = { ikDoc: 'ikHome', ikInvReview: 'ikHome', ikDocView: 'ikJournal', ikDocs: 'ikJournal', ikTtkCard: 'ikTtk', ikPrice: 'ikPrices' };
const homeIdx = () => stack.findIndex(s => s.view === 'ikHome');
const inShell = () => unitKey === 'victoria' && IK.dep && IK.meta && homeIdx() >= 0;
function currentSection() {
  for (let i = stack.length - 1; i >= 0; i--) {
    const v = stack[i].view;
    if (NAV.some(n => n.view === v)) return v;
    if (SECTION_OF[v]) return SECTION_OF[v];
  }
  return 'ikHome';
}
const atSectionRoot = () => inShell() && stack.length - 1 <= homeIdx() + 1 && NAV.some(n => n.view === stack[stack.length - 1].view);
function goSection(view, params = {}) {
  closeAllSheets();
  stack.length = homeIdx() + 1;
  if (view !== 'ikHome') stack.push({ view, ...params });
  haptic(); render();
}
function closeAllSheets() { while (sheetStack.length) sheetStack[sheetStack.length - 1].close(); }
function navAct(n) { if (n.act === 'inv') invStart(); else goSection(n.view); }
function switchDep(id) {
  const d = IK.meta.departments.find(x => x.id === id);
  if (!d || d.id === IK.dep.id) return;
  IK.dep = d; lsSet('lastDep', d.id);
  goSection(currentSection());
}
function toUnits() { closeAllSheets(); stack.length = 1; lsSet('lastUnit', ''); render(); }
const todayLabel = () => new Date().toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });

/* Поиск по всему: товары → остатки, блюда и заготовки → техкарта */
async function globalSearch() {
  if (!inShell() || sheetStack.length) return;
  const sh = openSheet(`<h2>Поиск</h2>
    <div class="search"><input id="gq" type="search" placeholder="Товар, блюдо, заготовка" autocomplete="off"></div>
    <div id="gl" class="pick-list"></div>`);
  const list = (await ikProducts()).filter(p => !p.deleted && ['GOODS', 'PREPARED', 'DISH', 'MODIFIER'].includes(p.type));
  const gq = sh.el.querySelector('#gq'), gl = sh.el.querySelector('#gl');
  const KIND = { GOODS: 'Товар → остатки', PREPARED: 'Заготовка → техкарта', DISH: 'Блюдо → техкарта', MODIFIER: 'Модификатор → техкарта' };
  const draw = () => {
    const q = norm(gq.value).trim();
    if (!q) { gl.innerHTML = '<p class="hint">Начните вводить название</p>'; return; }
    const words = q.split(/\s+/);
    const found = list.filter(p => { const n = norm(p.name); return words.every(w => n.includes(w)); })
      .sort((a, b) => (norm(a.name).startsWith(q) ? 0 : 1) - (norm(b.name).startsWith(q) ? 0 : 1) || a.name.length - b.name.length).slice(0, 40);
    gl.innerHTML = found.map(p => `<button class="gs-row" data-id="${p.id}"><span class="t-main"><div>${h(p.name.trim())}</div>
      <small>${KIND[p.type]} · ${h(p.group || 'без группы')}</small></span>${ico('chevron-right')}</button>`).join('') || '<div class="empty">Ничего не найдено</div>';
  };
  gq.oninput = draw;
  gl.onclick = (e) => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    const p = list.find(x => x.id === b.dataset.id);
    sh.close();
    if (p.type === 'GOODS') goSection('ikItems', { q: p.name.trim() });
    else { goSection('ikTtk'); go('ikTtkCard', { id: p.id }); }
  };
  draw();
  setTimeout(() => gq.focus(), 50);
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'л' || e.code === 'KeyK')) { e.preventDefault(); globalSearch(); }
});

/* Тема: тёмная, если в Telegram ночной режим (или в системе) */
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { if (tg && tg.setHeaderColor) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) { /* старый Telegram */ }
}
applyTheme();
if (tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme);

/* ================= Главная: сводка по заведению ================= */
async function ikDashboard() {
  IK.dash = IK.dash || {};
  const c = IK.dash[IK.dep.id];
  if (c && Date.now() - c.at < 5 * 60 * 1000) return c.data;
  const data_ = await api('/api/dashboard?dept=' + IK.dep.id);
  IK.dash[IK.dep.id] = { at: Date.now(), data: data_ };
  return data_;
}
const fRubK = (n) => Math.round(n || 0).toLocaleString('ru-RU') + ' ₽';

function spark(values) {
  if (values.length < 2) return '';
  const hi = Math.max(...values, 1), W = 100, H = 30;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * W).toFixed(1)},${(H - 3 - v / hi * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-opacity=".75" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}
function barsSvg(series) {
  const hi = Math.max(...series.map(s => s.sum), 1), n = series.length, W = 280, H = 110, gap = 4, bw = (W - gap * (n - 1)) / n;
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${series.map((s, i) => {
    const bh = Math.max(2, s.sum / hi * (H - 4));
    return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3"
      fill="var(--accent)" fill-opacity="${i === n - 1 ? 1 : .22}"><title>${fDate(s.date)}: ${fRubK(s.sum)}</title></rect>`;
  }).join('')}</svg>`;
}

VIEWS.ikHome = (el) => {
  lsSet('lastUnit', 'victoria'); lsSet('lastDep', IK.dep.id);
  const drafts = Object.keys(DOC_TYPES).map(k => [k, loadDraft(k)]).filter(([k, d]) => draftSize(k, d));
  const sk = '<span class="skel">000 000 ₽</span>';
  el.innerHTML = `
    <div class="home-head"><div><h1>${h(IK.dep.name)}</h1><p class="sub" id="hs">Сводка за вчера</p></div></div>
    ${drafts.map(([k, d]) => `
      <div class="banner">${ico('file-pencil')} <span>Незаконченный документ: <b>${DOC_TYPES[k].name.toLowerCase()}</b>, ${draftSize(k, d)} поз.</span>
        <button class="btn sm" data-new="${k}">Продолжить</button></div>`).join('')}
    <div class="kpis">
      <button class="kpi main" data-k="rev"><div class="l">Выручка вчера</div><div class="v" id="kRev">${sk}</div><div class="d" id="kRevD">&nbsp;</div><div id="kSpark"></div></button>
      <button class="kpi" data-k="fc"><div class="l">Фудкост</div><div class="v" id="kFc">${sk}</div><div class="d" id="kFcD">&nbsp;</div></button>
      <button class="kpi" data-k="wo"><div class="l">Списано</div><div class="v" id="kWo">${sk}</div><div class="d">вчера, себест.</div></button>
      <button class="kpi" data-k="pr"><div class="l">Цены</div><div class="v" id="kPr">${sk}</div><div class="d" id="kPrD">&nbsp;</div></button>
    </div>
    <div class="home-grid">
      <section class="panel"><h3>Требует внимания</h3><div id="attn"><p class="hint">Загружаю из iiko…</p></div></section>
      <section class="panel"><h3>Выручка, 14 дней</h3><div id="bars"><div class="skel" style="height:110px"></div></div><div class="bars-x" id="barsX"></div>
        <div class="acts">
          <button class="pri" data-new="invoice">${ico('file-plus')}Приход</button>
          <button data-new="writeoff">${ico('file-minus')}Списание</button>
          <button data-inv>${ico('clipboard-list')}Инвентар.</button>
        </div></section>
    </div>
    <button class="fab" id="fab" aria-label="Новый документ">${ico('plus')}</button>`;
  const newDoc = (k) => go('ikDoc', { type: k });
  el.querySelectorAll('[data-new]').forEach(b => b.onclick = () => newDoc(b.dataset.new));
  el.querySelector('[data-inv]').onclick = invStart;
  el.querySelector('#fab').onclick = () => {
    const sh = openSheet(`<h2>Новый документ</h2><div class="pick">
      <button data-m="invoice"><span class="e">${ico('file-plus')}</span><span><b>Приход</b><small>Накладная от поставщика</small></span></button>
      <button data-m="writeoff"><span class="e">${ico('file-minus')}</span><span><b>Списание</b><small>Порча, персонал, представительские</small></span></button>
      <button data-m="inv"><span class="e">${ico('clipboard-list')}</span><span><b>Инвентаризация</b><small>Пересчёт склада</small></span></button></div>`);
    sh.el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { sh.close(); b.dataset.m === 'inv' ? invStart() : newDoc(b.dataset.m); });
  };
  el.querySelector('[data-k="fc"]').onclick = () => goSection('ikTtk', { mode: 'fc' });
  el.querySelector('[data-k="pr"]').onclick = () => goSection('ikPrices', { filter: 'up', days: '30' });
  el.querySelector('[data-k="wo"]').onclick = () => goSection('ikJournal');
  el.querySelector('[data-k="rev"]').onclick = () => {};
  const depId = IK.dep.id;
  ikDashboard().then(dsh => {
    if (!IK.dep || IK.dep.id !== depId || !el.isConnected) return;
    const set = (id, html) => { const x = el.querySelector('#' + id); if (x) x.innerHTML = html; };
    set('hs', 'Сводка за вчера, ' + new Date(dsh.date).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }));
    set('kRev', fRubK(dsh.revenue));
    if (dsh.revenueWeekAgo) {
      const x = (dsh.revenue - dsh.revenueWeekAgo) / dsh.revenueWeekAgo * 100;
      set('kRevD', `<span class="${x >= 0 ? 'plus' : 'minus'}">${x >= 0 ? '+' : ''}${Math.round(x)}%</span> к тому же дню неделю назад`);
    }
    set('kSpark', spark(dsh.series.map(s => s.sum)));
    const fc = dsh.foodcost;
    set('kFc', fc.avg != null ? Math.round(fc.avg) + '%' : '—');
    set('kFcD', `норма ${fc.limit}%` + (fc.over ? ` · <span class="minus">выше — ${fc.over}</span>` : ''));
    set('kWo', fRubK(dsh.writeoff));
    set('kPr', `${dsh.prices.up} ↑ ${dsh.prices.down} ↓`);
    set('kPrD', dsh.prices.check ? `<span class="minus">${dsh.prices.check} проверить</span>` : 'за неделю');
    set('bars', barsSvg(dsh.series));
    set('barsX', `<span>${fDate(dsh.series[0].date).slice(0, 5)}</span><span>${fDate(dsh.series[dsh.series.length - 1].date).slice(0, 5)}</span>`);
    const row = (key, icon, cls, title, sub, pill, pcls) => `<button class="att" data-a="${key}"><span class="dot ${cls}">${ico(icon)}</span>
      <span class="t-main"><div>${title}</div><div>${sub}</div></span><span class="pill ${pcls}">${pill}</span></button>`;
    set('attn', [
      row('neg', 'arrow-down-right', dsh.negNewCount ? 'c-danger' : 'c-mute', 'Ушли в минус за день', `всего в минусе ${dsh.negAll}`,
        dsh.negNewCount ? dsh.negNewCount + ' нов.' : 'нет', dsh.negNewCount ? 'c-danger' : 'c-ok'),
      row('nd', 'file-alert', dsh.notDoneCount ? 'c-warn' : 'c-mute', 'Не проведены в iiko', 'накладные и списания за 2 недели',
        dsh.notDoneCount || 'нет', dsh.notDoneCount ? 'c-warn' : 'c-ok'),
      row('chk', 'alert-triangle', dsh.prices.check ? 'c-warn' : 'c-mute', 'Цена в разы — проверьте единицы', 'накладные за неделю',
        dsh.prices.check || 'нет', dsh.prices.check ? 'c-warn' : 'c-ok'),
      row('fc', 'chef-hat', fc.over + fc.broken ? 'c-acc' : 'c-mute', `Фудкост выше ${fc.limit}%`, fc.broken ? `ещё ${fc.broken} — похоже на ошибку в техкарте` : 'по продажам за 30 дней',
        (fc.over + fc.broken) || 'нет', fc.over + fc.broken ? 'c-acc' : 'c-ok'),
    ].join(''));
    el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if (a === 'neg') openSheet(`<h2>Ушли в минус за день</h2><p class="sub">Обычно это значит, что не заведён приход или перемещение.</p>
        ${dsh.negNew.map(x => `<div class="rep-row"><span class="t-main"><div>${h(x.name)}</div><div class="cnt-meta">${h(x.store)}</div></span>
          <span class="t-side minus"><b>${fQty(x.amount)}</b> ${h(x.unit)}</span></div>`).join('') || '<div class="empty">Новых минусов нет</div>'}`);
      else if (a === 'nd') openSheet(`<h2>Не проведены в iiko</h2><p class="sub">Проверьте и проведите в iikoOffice.</p>
        ${dsh.notDone.map(x => `<div class="rep-row"><span class="t-main"><div>${x.kind === 'invoice' ? 'Накладная' : 'Списание'} № ${h(x.number)}</div>
          <div class="cnt-meta">${fDate(x.date)}${x.who ? ' · ' + h(x.who) : ''}</div></span></div>`).join('') || '<div class="empty">Всё проведено</div>'}`);
      else if (a === 'chk') goSection('ikPrices', { filter: 'check', days: '30' });
      else if (a === 'fc') goSection('ikTtk', { mode: 'fc' });
    });
  }).catch(e => {
    const x = el.querySelector('#attn');
    if (x) x.innerHTML = `<p class="hint">${/Not Found|404/.test(e.message) ? 'Сводка появится после перезапуска сервера (start.cmd).' : h(e.message)}</p>`;
    el.querySelectorAll('.skel').forEach(s => { s.classList.remove('skel'); s.textContent = '—'; });
  });
};

/* Быстрый старт: сразу открыть последнее заведение */
async function boot() {
  if (lsGet('lastUnit') === 'victoria' && lsGet('lastDep')) {
    $app.innerHTML = '<p class="hint" style="padding:16px">Загрузка…</p>';
    try {
      IK.meta = IK.meta || await api('/api/meta');
      const d = IK.meta.departments.find(x => x.id === lsGet('lastDep'));
      if (d) {
        unitKey = 'victoria'; IK.dep = d;
        stack.length = 1; stack.push({ view: 'ikDeps' }, { view: 'ikHome' });
      }
    } catch (e) { console.error(e); }
  }
  render();
}

boot();
